// Courbe d'évolution du solde en SVG
function projChartHTML(series){
  const W = 320, H = 130, padL = 6, padR = 6, padT = 14, padB = 22;
  const vals = series.map(s=>s.value);
  let min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  if(max===min){ max += 1; }
  const range = max - min;
  min -= range*0.08; max += range*0.08;
  const x = i => padL + i*(W-padL-padR)/(series.length-1);
  const y = v => padT + (max-v)*(H-padT-padB)/(max-min);
  const pts = series.map((s,i)=>`${x(i).toFixed(1)},${y(s.value).toFixed(1)}`);
  const line = pts.join(' ');
  const area = `${padL},${y(Math.max(min,0)).toFixed(1)} ${line} ${x(series.length-1).toFixed(1)},${y(Math.max(min,0)).toFixed(1)}`;
  const zeroY = y(0);
  // étiquettes : premier, milieu, dernier
  const labIdx = series.length>2 ? [0, Math.floor((series.length-1)/2), series.length-1] : [0, series.length-1];
  const labels = labIdx.map(i=>`<text x="${x(i)}" y="${H-6}" font-size="9" fill="#5C6B62" text-anchor="${i===0?'start':(i===series.length-1?'end':'middle')}" font-family="JetBrains Mono,monospace">${series[i].label}</text>`).join('');
  const lastNeg = series[series.length-1].value < 0;
  const stroke = lastNeg ? '#FF7E67' : '#5EE2A0';
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:18px;display:block;">
    <defs>
      <linearGradient id="projFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${stroke}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${zeroY>=padT && zeroY<=H-padB ? `<line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 4" stroke-width="1"/><text x="${W-padR}" y="${zeroY-4}" font-size="8" fill="#5C6B62" text-anchor="end" font-family="JetBrains Mono,monospace">0 €</text>` : ''}
    <polygon points="${area}" fill="url(#projFill)"/>
    <polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.value)}" r="${i===series.length-1?4:2.4}" fill="${s.value<0?'#FF7E67':stroke}" ${i===series.length-1?'stroke="#0C120F" stroke-width="1.5"':''}/>`).join('')}
    ${labels}
  </svg>`;
}

function attachPrevisionnelHandlers(){
  // --- plafonds ---
  document.querySelectorAll('[data-budget]').forEach(b=>{
    b.onclick = async ()=>{
      const cat = b.dataset.budget;
      const actuel = budgetOf(cat);
      const saisie = await askInput({
        title:`Plafond — ${cat}`,
        message:'Montant maximum que vous vous autorisez sur ce poste ce mois-ci.\nLaissez vide pour retirer le plafond.',
        value: actuel>0 ? String(actuel).replace('.',',') : '',
        placeholder:'0,00', numeric:true, okLabel:'Enregistrer'
      });
      if(saisie===null) return;
      if(saisie.trim()===''){ setBudget(cat, 0); showToast('Plafond retiré', 'ok'); render(); return; }
      if(!isValidAmountInput(saisie)){ showToast('⚠ Montant invalide.', 'error'); return; }
      const v = Math.abs(parseUserAmount(saisie));
      setBudget(cat, v);
      showToast(v>0 ? `Plafond fixé à ${fmt(v)}` : 'Plafond retiré', 'ok');
      render();
    };
  });
  const prop = document.getElementById('btn-proposer-plafonds');
  if(prop) prop.onclick = async ()=>{
    const ok = await askConfirm(
      'Des plafonds vont être proposés d’après vos dépenses des 3 derniers mois, hors charges fixes.\n\n'
      + 'S’ils dépassent ce que vos revenus permettent, ils seront réduits proportionnellement. Vos plafonds actuels seront remplacés.',
      'Proposer');
    if(!ok) return;
    const n = proposerPlafonds();
    if(!n){ showToast('Pas assez d’historique sur les 3 derniers mois pour proposer des plafonds.', 'error'); return; }
    showToast(`${n} plafond(s) proposé(s) — ajustez-les à votre main.`, 'ok');
    render();
  };

  document.querySelectorAll('[data-horizon]').forEach(b=>{
    b.onclick = ()=>{ projHorizon = parseInt(b.dataset.horizon,10); render(); };
  });
  const varToggle = document.getElementById('proj-include-var');
  if(varToggle) varToggle.onchange = e=>{ projIncludeVar = e.target.checked; render(); };

  // --- réserves ---
  const resL = document.getElementById('res-label');
  if(resL) resL.oninput = e=>{ resForm.label = e.target.value; };
  const resA = document.getElementById('res-amount');
  if(resA) resA.oninput = e=>{ resForm.amount = e.target.value; };
  const addRes = document.getElementById('btn-add-res');
  if(addRes) addRes.onclick = ()=>{
    const amt = parseUserAmount(resForm.amount);
    if(!resForm.label.trim()){ showToast('⚠ Merci d’indiquer le nom du compte.', 'error'); return; }
    state.reserves.push({id:uid(), label:resForm.label.trim(), amount:amt, createdAt:Date.now(), updatedAt:Date.now()});
    resForm = {label:'',amount:''};
    saveData(); render();
  };
  document.querySelectorAll('[data-res-adjust]').forEach(b=>{
    b.onclick = async ()=>{
      const r = state.reserves.find(x=>x.id===b.dataset.resAdjust);
      if(!r) return;
      const input = await askInput({
        title:`Ajuster « ${escapeHTML(r.label)} »`,
        message:'Nouveau solde de la réserve (€) :',
        value:String(r.amount.toFixed(2)).replace('.',','), numeric:true
      });
      if(input===null || input.trim()==='') return;
      if(!isValidAmountInput(input)){ showToast('⚠ Montant invalide, solde inchangé.', 'error'); return; }
      r.amount = parseUserAmount(input);
      r.updatedAt = Date.now();
      saveData(); showToast('Solde de la réserve mis à jour', 'ok'); render();
    };
  });
  document.querySelectorAll('[data-res-transfer]').forEach(b=>{
    b.onclick = async ()=>{
      const r = state.reserves.find(x=>x.id===b.dataset.resTransfer);
      if(!r) return;
      const input = await askInput({
        title:`Virement avec « ${escapeHTML(r.label)} »`,
        message:'· montant positif = du compte courant VERS la réserve\n· montant négatif = retrait de la réserve vers le courant',
        placeholder:'0,00', numeric:true
      });
      if(input===null || input.trim()==='') return;
      if(!isValidAmountInput(input)){ showToast('⚠ Montant invalide, aucun virement effectué.', 'error'); return; }
      const m = parseUserAmount(input);
      if(!m){ return; }
      r.amount += m;
      r.updatedAt = Date.now();
      state.transactions.push({
        id:uid(), date:todayISO(),
        amount:-m, // vers la réserve = sortie du courant ; retrait = entrée
        category:SAVINGS_CAT,
        description:(m>0?'Virement vers ':'Retrait de ')+r.label,
        details:[], source:'manuel', createdAt:Date.now(), updatedAt:Date.now()
      });
      saveData();
      showToast(m>0?`${fmt(m)} placés sur ${r.label}`:`${fmt(-m)} récupérés de ${r.label}`, 'ok');
      render();
    };
  });
  document.querySelectorAll('[data-rm-res]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await askConfirm('Supprimer cette réserve ? Le solde qu’elle contient ne sera plus compté.')) return;
      state.reserves = state.reserves.filter(r=>r.id!==b.dataset.rmRes);
      markDeleted(b.dataset.rmRes);
      saveData(); render();
    };
  });

  // confirmation manuelle des récurrents
  const curMk = todayISO().slice(0,7);
  const markAnd = (sel, val, msg)=>{
    document.querySelectorAll(`[data-${sel}]`).forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset[sel.replace(/-(.)/g, (m,c)=>c.toUpperCase())];
        setRecMark(id, curMk, val);
        saveData(); if(msg) showToast(msg, 'ok'); render();
      };
    });
  };
  markAnd('rec-paid',    'paid',    'Échéance marquée comme passée');
  markAnd('rec-pending', 'pending', 'Échéance marquée comme non passée');
  markAnd('rec-clear',   null,      'Détection automatique rétablie');

  // frais ponctuels arrivés à échéance
  document.querySelectorAll('[data-up-done]').forEach(b=>{
    b.onclick = ()=>{
      const u = state.upcoming.find(x=>x.id===b.dataset.upDone);
      if(!u) return;
      state.transactions.push({
        id:uid(), date:u.date, amount:-Math.abs(u.amount), category:u.category,
        description:u.label, details:[], source:'manuel',
        createdAt:Date.now(), updatedAt:Date.now()
      });
      state.upcoming = state.upcoming.filter(x=>x.id!==u.id);
      markDeleted(u.id);
      saveData(); showToast(`« ${u.label} » ajouté aux opérations`, 'ok'); render();
    };
  });
  document.querySelectorAll('[data-up-later]').forEach(b=>{
    b.onclick = async ()=>{
      const u = state.upcoming.find(x=>x.id===b.dataset.upLater);
      if(!u) return;
      const input = await askInput({
        title:`Reporter « ${escapeHTML(u.label)} »`,
        message:'Nouvelle date prévue (JJ/MM/AAAA) :',
        value:u.date.split('-').reverse().join('/')
      });
      if(input===null || !input.trim()) return;
      const iso = excelDateToISO(input.trim());
      if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)){ showToast('⚠ Date non reconnue.', 'error'); return; }
      u.date = iso;
      u.updatedAt = Date.now();
      saveData(); showToast('Frais reporté au ' + input.trim(), 'ok'); render();
    };
  });

  const rl = document.getElementById('rec-label');
  if(rl) rl.oninput = e=>{ recForm.label = e.target.value; };
  const ra = document.getElementById('rec-amount');
  if(ra) ra.oninput = e=>{ recForm.amount = e.target.value; };
  const rd = document.getElementById('rec-day');
  if(rd) rd.oninput = e=>{ recForm.day = e.target.value; };
  const rc = document.getElementById('rec-cat');
  if(rc) rc.onchange = e=>{ recForm.category = e.target.value; };
  document.querySelectorAll('[data-rec-type]').forEach(b=>{
    b.onclick = ()=>{ recForm.type = b.dataset.recType; render(); };
  });
  const addRec = document.getElementById('btn-add-rec');
  if(addRec) addRec.onclick = ()=>{
    const amt = parseUserAmount(recForm.amount);
    const day = Math.min(31, Math.max(1, parseInt(recForm.day,10)||1));
    if(!recForm.label.trim() || !amt){ showToast('⚠ Merci d’indiquer un libellé et un montant.', 'error'); return; }
    state.recurring.push({id:uid(), label:recForm.label.trim(), amount:amt, category:recForm.category, day, type:recForm.type, createdAt:Date.now()});
    recForm = {label:'',amount:'',category:'Sport / Loisirs / Abonnements',day:'1',type:'expense'};
    saveData(); render();
  };
  document.querySelectorAll('[data-rm-rec]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await askConfirm('Supprimer cette charge récurrente ?')) return;
      state.recurring = state.recurring.filter(r=>r.id!==b.dataset.rmRec);
      markDeleted(b.dataset.rmRec);
      saveData(); render();
    };
  });

  const ul = document.getElementById('up-label');
  if(ul) ul.oninput = e=>{ upForm.label = e.target.value; };
  const ua = document.getElementById('up-amount');
  if(ua) ua.oninput = e=>{ upForm.amount = e.target.value; };
  const ud = document.getElementById('up-date');
  if(ud) ud.onchange = e=>{ upForm.date = e.target.value; };
  const uc = document.getElementById('up-cat');
  if(uc) uc.onchange = e=>{ upForm.category = e.target.value; };
  const addUp = document.getElementById('btn-add-up');
  if(addUp) addUp.onclick = ()=>{
    const amt = parseUserAmount(upForm.amount);
    if(!upForm.label.trim() || !amt || !upForm.date){ showToast('⚠ Merci d’indiquer un libellé, un montant et une date.', 'error'); return; }
    state.upcoming.push({id:uid(), label:upForm.label.trim(), amount:amt, category:upForm.category, date:upForm.date, createdAt:Date.now()});
    upForm = {label:'',amount:'',category:'Non catégorisé',date:''};
    saveData(); render();
  };
  document.querySelectorAll('[data-rm-up]').forEach(b=>{
    b.onclick = async ()=>{
      if(!await askConfirm('Supprimer ce frais prévu ?')) return;
      state.upcoming = state.upcoming.filter(u=>u.id!==b.dataset.rmUp);
      markDeleted(b.dataset.rmUp);
      saveData(); render();
    };
  });
}

// ---------- LE MOIS (onglet Historique) ----------
function prevMonthKey(mk){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// La silhouette du mois : une barre par jour de prélèvement, hauteur
// proportionnelle au montant. Plein mint = déjà passé, dégradé corail = à tomber.
// On lit d'un coup d'œil quand tombent les gros débits et ce qui reste devant soi.
function ligneMoisHTML(a){
  const nDays = daysOfMonth(a.mk);
  const pos = day => (day-1)/(nDays-1)*100;
  const at = pct => `calc(9px + (100% - 18px) * ${(pct/100).toFixed(4)})`;

  const byDay = new Map();
  a.recExp.forEach(r=>{
    if(!byDay.has(r.expDay)) byDay.set(r.expDay, []);
    byDay.get(r.expDay).push(r);
  });
  if(!byDay.size) return '';

  const jours = [...byDay.entries()].map(([day, rs])=>({
    day, rs,
    total: rs.reduce((s,r)=>s+Math.abs(r.match ? r.match.amount : r.amount),0),
    done: rs.filter(r=>r.st==='fait'||r.st==='probable').length
  }));
  const maxTot = Math.max(...jours.map(j=>j.total));
  const H = 62; // hauteur max d'une barre
  // échelle en racine carrée : à l'échelle linéaire une mensualité de prêt écrase
  // tout le reste et les petites charges deviennent invisibles. L'ordre des
  // hauteurs reste fidèle, seuls les écarts sont adoucis.
  const hauteur = v => Math.max(6, Math.round(Math.sqrt(v/maxTot)*H));

  const todayD = a.isCurrent ? new Date().getDate() : null;
  const fillPct = a.isPast ? 100 : (a.isFuture ? 0 : pos(todayD));

  const bars = jours.map(j=>{
    const cls = j.done===j.rs.length ? '' : (j.done>0 ? 'maybe' : 'todo');
    const h = hauteur(j.total);
    const noms = j.rs.map(r=>r.label).join(', ');
    // seule la charge la plus lourde porte son montant : au-delà ça devient illisible
    const label = j.total >= maxTot*0.9
      ? `<span class="bar-amt">${Math.round(j.total)} €</span>` : '';
    return `<span class="bar ${cls}" style="left:${at(pos(j.day))};height:${h}px"
      data-info="${escapeHTML(noms)} — ${fmt(j.total)} (le ${j.day})">${label}</span>`;
  }).join('');

  const marks = [...new Set([1, Math.round(nDays/2), nDays])];
  const labels = marks.map(d=>`<span class="ligne-day" style="left:${at(pos(d))}">${d}</span>`).join('');

  return `
    <div class="ligne-mois">
      <div class="ligne-rail"></div>
      <div class="ligne-fill" style="width:${at(fillPct)}"></div>
      ${bars}
      ${todayD ? `<div class="ligne-today" style="left:${at(pos(todayD))}"><span>auj.</span></div>` : ''}
      ${labels}
    </div>
    <div class="ligne-legend">
      <span><i style="background:var(--mint)"></i>prélevée</span>
      <span><i style="background:var(--coral)"></i>à tomber</span>
    </div>`;
}

function chargeRowHTML(r, isPast){
  const done = r.st==='fait' || r.st==='probable';
  const montant = Math.abs(r.match ? r.match.amount : r.amount);
  const etat = r.st==='fait' ? ['prélevée','var(--mint)']
    : r.st==='probable' ? ['probablement prélevée','var(--sky)']
    : r.st==='attendu' ? (isPast ? ['non retrouvée sur le relevé','var(--ink-faint)'] : ['attendue — pas encore vue','var(--gold)'])
    : ['à venir','var(--ink-faint)'];
  return `<div class="chg ${done?'done':'todo'}">
    <div class="chg-day">${r.expDay}</div>
    <div class="chg-body">
      <div class="chg-label">${escapeHTML(r.label)}</div>
      <div class="chg-state" style="color:${etat[1]}">${etat[0]}</div>
    </div>
    <div class="chg-amt" style="color:${done?'var(--ink-faint)':'var(--coral)'}">${fmt(montant)}</div>
  </div>`;
}

function moisPanelHTML(mk){
  const a = monthAnalysis(mk);
  if(!a.tx.length && !a.recExp.length){
    return `<div class="card"><div class="empty"><div class="big">${monthLabel(mk)}</div>Aucune opération sur ce mois.</div></div>`;
  }

  const fixe = a.fixePasse;
  const varia = a.variable;
  const tot = fixe + varia;
  const pFixe = tot>0 ? Math.round(fixe/tot*100) : 0;

  // le chiffre de tête change de nature selon qu'on regarde le mois en cours
  // (ce qui reste à tomber) ou un mois révolu (ce qu'il a coûté)
  const head = (a.isCurrent||a.isFuture)
    ? {eyebrow:'Reste à passer', val:a.resteAPasser, color:a.resteAPasser>0?'var(--coral)':'var(--mint)'}
    : {eyebrow:'Dépensé ce mois-là', val:a.depenses, color:'var(--ink)'};
  const h = fmtSplit(head.val);

  const nReste = a.nTotal - a.nFaites;
  let sub;
  if(a.isCurrent||a.isFuture){
    sub = nReste>0
      ? `Il reste ${nReste} charge${nReste>1?'s':''} fixe${nReste>1?'s':''} à prélever sur ${a.nTotal}`
      : (a.nTotal ? 'Toutes vos charges fixes sont passées.' : 'Aucune charge fixe déclarée.');
    if(a.upAVenir>0) sub += ` · ${fmt(a.upAVenir)} de frais prévus`;
  } else {
    const prev = monthAnalysis(prevMonthKey(mk));
    if(prev.depenses>0){
      const delta = a.depenses - prev.depenses;
      const pct = Math.round(Math.abs(delta)/prev.depenses*100);
      sub = delta>=0
        ? `${pct} % de plus qu'en ${monthLabel(prev.mk)}`
        : `${pct} % de moins qu'en ${monthLabel(prev.mk)}`;
    } else {
      sub = `${a.tx.length} opération${a.tx.length>1?'s':''}`;
    }
  }

  const cats = monthByCategory(a.tx).slice(0,6);
  const maxCat = cats.length ? cats[0].total : 1;

  const charges = [...a.recExp].sort((x,y)=>{
    const dx = (x.st==='fait'||x.st==='probable') ? 1 : 0;
    const dy = (y.st==='fait'||y.st==='probable') ? 1 : 0;
    return dx-dy || x.expDay-y.expDay;
  });

  return `
    <div class="card" style="padding:20px 18px 18px;">
      <div class="mois-head">
        <span class="mois-eyebrow">${escapeHTML(monthLabel(mk))}</span>
        <span class="mois-eyebrow" style="color:var(--ink-soft);">${head.eyebrow}</span>
      </div>
      <div class="mois-big" style="color:${head.color};">${h.sign}${h.ent}<span class="cents">,${h.cents} €</span></div>
      <div class="mois-sub">${sub}</div>
      ${ligneMoisHTML(a)}
    </div>

    ${tot>0 ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span class="mois-eyebrow">Subi / arbitrable</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);">${pFixe} % de fixe</span>
      </div>
      <div class="jauge">
        <span style="width:${pFixe}%;background:var(--lilac);"></span>
        <span style="width:${100-pFixe}%;background:var(--mint);"></span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;">
        <span style="color:var(--lilac);">Charges fixes <strong style="font-family:'JetBrains Mono',monospace;">${fmt(fixe)}</strong></span>
        <span style="color:var(--mint);"><strong style="font-family:'JetBrains Mono',monospace;">${fmt(varia)}</strong> au quotidien</span>
      </div>
      ${a.revenus>0 ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);">
        Revenus ${fmt(a.revenus)} · reste <strong style="color:${a.revenus-tot>=0?'var(--mint)':'var(--coral)'};font-family:'JetBrains Mono',monospace;">${fmt(a.revenus-tot)}</strong>${a.epargne>0?` · ${fmt(a.epargne)} mis de côté`:''}
      </div>` : ''}
    </div>` : ''}

    ${charges.length ? `
    <h2 class="section-title">Charges fixes du mois</h2>
    <div class="card" style="padding:6px 18px;">
      ${charges.map(r=>chargeRowHTML(r, a.isPast)).join('')}
    </div>` : ''}

    ${cats.length ? `
    <h2 class="section-title">Où part l'argent</h2>
    <div class="card">
      ${cats.map(c=>`
        <div class="catbar">
          <div class="catbar-top">
            <span class="catbar-name">${escapeHTML(c.name)}</span>
            <span class="catbar-val">${fmt(c.total)}</span>
          </div>
          <div class="catbar-rail"><div class="catbar-fill" style="width:${Math.max(3,Math.round(c.total/maxCat*100))}%;background:${c.color};"></div></div>
        </div>`).join('')}
    </div>` : ''}
  `;
}

let histView = 'mois'; // 'mois' = synthèse mensuelle, 'liste' = opérations détaillées
function historiqueHTML(){
  const months = Array.from(new Set(state.transactions.map(t=>monthKey(t.date)))).filter(Boolean).sort().reverse();
  const f = state.historyFilters;
  // le panneau mensuel a toujours besoin d'un mois : à défaut de filtre, le mois courant
  const panelMk = f.month!=='all' ? f.month : todayISO().slice(0,7);
  let list = [...state.transactions];
  if(f.month!=='all') list = list.filter(t=>monthKey(t.date)===f.month);
  if(f.cat!=='all') list = list.filter(t=>t.category===f.cat);
  if(f.q) list = list.filter(t=>(t.description||'').toLowerCase().includes(f.q.toLowerCase()));
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const totalShown = list.reduce((s,t)=>s+t.amount,0);

  return `
    <h2 class="section-title">Historique</h2>
    <div class="filters">
      <select id="hf-month">
        <option value="all" ${f.month==='all'?'selected':''}>Tous les mois</option>
        ${months.map(m=>`<option value="${m}" ${f.month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
      </select>
      <select id="hf-cat">
        <option value="all" ${f.cat==='all'?'selected':''}>Toutes catégories</option>
        ${state.categories.map(c=>`<option value="${escapeHTML(c.name)}" ${f.cat===c.name?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}
      </select>
    </div>

    <div class="toggle-group" style="margin-bottom:16px;">
      <button type="button" class="toggle-btn ${histView==='mois'?'active-inc':''}" data-hview="mois">Le mois</button>
      <button type="button" class="toggle-btn ${histView==='liste'?'active-exp':''}" data-hview="liste">Opérations</button>
    </div>

    ${histView==='mois' ? moisPanelHTML(panelMk) : `
    <input type="text" id="hf-q" placeholder="Rechercher un libellé…" value="${escapeHTML(f.q)}" style="margin-bottom:16px;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;align-items:center;">
        <span class="muted">${list.length} opération(s)</span>
        <span style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${totalShown<0?'var(--coral)':'var(--mint)'};">${fmt(totalShown)}</span>
      </div>
      ${list.length ? list.map(rowHTML).join('') : '<div class="empty"><div class="big">Aucun résultat</div>Aucune opération ne correspond à ces filtres.</div>'}
    </div>`}

    <button class="secondary" id="btn-export" style="margin-bottom:8px;">⇩ Exporter tout en Excel (lecture)</button>
    <button class="secondary" id="btn-backup-json" style="margin-bottom:8px;">⇩ Sauvegarde complète (JSON)</button>
    <input type="file" id="restore-json" accept=".json" style="display:none;">
    <button class="ghost" id="btn-restore-json" style="width:100%;text-align:center;margin-bottom:8px;">↺ Restaurer une sauvegarde JSON</button>
    <p class="muted" style="text-align:center;font-size:11.5px;margin:0 0 8px;">Le JSON est la vraie copie de secours : il restaure tout (opérations, catégories, récurrents, réserves, solde). L’Excel sert à consulter les données.</p>
  `;
}

// ---------- HANDLERS ----------
function attachHandlers(){
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    // changer d'onglet referme la vue détaillée, sinon elle resterait affichée par-dessus
    b.onclick = ()=>{ drill = null; state.tab = b.dataset.tab; render(); };
  });
  if(drill){ attachDrillHandlers(); return; }
  const balEl = document.getElementById('balance-adjust');
  if(balEl) balEl.onclick = async ()=>{
    const cur = currentBalance();
    const input = await askInput({
      title:'Caler le solde',
      message:'Quel est le solde réel actuel de votre compte bancaire (€) ?\nL’app se calera dessus sans toucher aux opérations. Tout ce qui est daté d’aujourd’hui ou avant est considéré comme déjà compris dans ce solde : vous pouvez donc importer vos relevés passés sans fausser le calcul.',
      value:String(cur.toFixed(2)).replace('.',','), numeric:true
    });
    if(input===null || input.trim()==='') return;
    if(!isValidAmountInput(input)){ showToast('⚠ Montant invalide, solde inchangé.', 'error'); return; }
    const real = parseUserAmount(input);
    state.balanceAnchor = {amount: real, at: Date.now()};
    saveData();
    showToast('Solde calé sur ' + fmt(real), 'ok');
    render();
  };
  if(state.tab==='ajouter') attachAjouterHandlers();
  if(state.tab==='previsionnel') attachPrevisionnelHandlers();
  if(state.tab==='planning') attachPlanningHandlers();
  if(state.tab==='importer') attachImporterHandlers();
  if(state.tab==='historique') attachHistoriqueHandlers();
  if(state.tab==='apercu'){
    attachRowHandlers();
    attachCategoriesHandlers();
    document.querySelectorAll('[data-period]').forEach(b=>{
      b.onclick = ()=>{ apercuPeriod = parseInt(b.dataset.period,10); render(); };
    });
    document.querySelectorAll('[data-drill]').forEach(el=>{
      el.onclick = ()=>openDrill(el.dataset.drill, apercuPeriod);
    });
    // l'attribut title est inopérant au doigt : un appui sur un segment l'annonce
    document.querySelectorAll('.mrow-stack span').forEach(s=>{
      s.onclick = ()=>showToast(s.getAttribute('title')||'', 'ok');
    });
    const banner = document.getElementById('banner-to-id');
    if(banner) banner.onclick = ()=>{
      state.tab='historique';
      state.historyFilters={month:'all',cat:'À catégoriser',q:''};
      render();
      window.scrollTo(0,0);
    };
    const autoBtn = document.getElementById('btn-auto-classify');
    if(autoBtn) autoBtn.onclick = ()=>{
      const n = autoClassifyExisting();
      if(n===0){
        showToast('Aucune de ces lignes n’a pu être classée avec certitude — classez-en une à la main, les suivantes suivront.', 'error');
        return;
      }
      saveData();
      showToast(`${n} opération(s) classée(s)`, 'ok');
      render();
    };
  }
}

function attachRowHandlers(){
  document.querySelectorAll('[data-row]').forEach(el=>{
    el.onclick = ()=>{
      const t = state.transactions.find(x=>x.id===el.dataset.row);
      if(!t) return;
      addFormState = {
        id:t.id, type:t.amount<0?'expense':'income', date:t.date,
        amount:String(Math.abs(t.amount)), category:t.category,
        description:t.description||'', details:t.details? JSON.parse(JSON.stringify(t.details)) : []
      };
      state.tab='ajouter';
      render();
      window.scrollTo(0,0);
    };
  });
}

function renameCategoryRefs(oldName, newName){
  const stamp = Date.now();
  state.transactions.forEach(t=>{ if(t.category===oldName){ t.category=newName; t.updatedAt=stamp; } });
  state.recurring.forEach(r=>{ if(r.category===oldName){ r.category=newName; r.updatedAt=stamp; } });
  state.upcoming.forEach(u=>{ if(u.category===oldName){ u.category=newName; u.updatedAt=stamp; } });
  if(state.historyFilters.cat===oldName) state.historyFilters.cat=newName;
}

function attachCategoriesHandlers(){
  const det = document.getElementById('cat-mgr');
  if(det) det.ontoggle = ()=>{ catMgrOpen = det.open; };

  const nameIn = document.getElementById('new-cat-name');
  if(nameIn) nameIn.oninput = e=>{ newCatForm.name = e.target.value; };
  const colorIn = document.getElementById('new-cat-color');
  if(colorIn) colorIn.onchange = e=>{ newCatForm.color = e.target.value; render(); };

  const addBtn = document.getElementById('btn-add-cat');
  if(addBtn) addBtn.onclick = ()=>{
    const name = newCatForm.name.trim();
    if(!name){ showToast('⚠ Merci d’indiquer un nom de catégorie.', 'error'); return; }
    if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
      showToast('⚠ Cette catégorie existe déjà.', 'error'); return;
    }
    const idx = state.categories.findIndex(c=>c.name==='Non catégorisé');
    state.categories.splice(idx<0?state.categories.length:idx, 0, {name, color:newCatForm.color, updatedAt:Date.now()});
    // si elle avait été supprimée par le passé, on retire son tombstone
    state.deleted = (state.deleted||[]).filter(d=>d.id!=='cat:'+name);
    newCatForm = {name:'', color:newCatForm.color};
    saveData(); showToast(`Catégorie « ${name} » ajoutée`, 'ok'); render();
  };

  document.querySelectorAll('[data-cat-color]').forEach(inp=>{
    inp.onchange = ()=>{
      const c = state.categories.find(x=>x.name===inp.dataset.catColor);
      if(!c) return;
      c.color = inp.value;
      c.updatedAt = Date.now();
      saveData(); render();
    };
  });

  document.querySelectorAll('[data-cat-rename]').forEach(b=>{
    b.onclick = async ()=>{
      const oldName = b.dataset.catRename;
      const c = state.categories.find(x=>x.name===oldName);
      if(!c) return;
      const input = await askInput({title:'Renommer la catégorie', value:oldName, okLabel:'Renommer'});
      if(input===null) return;
      const newName = input.trim();
      if(!newName || newName===oldName) return;
      if(state.categories.some(x=>x.name.toLowerCase()===newName.toLowerCase())){
        showToast('⚠ Une catégorie porte déjà ce nom.', 'error'); return;
      }
      c.name = newName;
      c.updatedAt = Date.now();
      renameCategoryRefs(oldName, newName);
      markDeleted('cat:'+oldName); // l'ancien nom ne doit pas réapparaître à la fusion
      state.deleted = state.deleted.filter(d=>d.id!=='cat:'+newName);
      saveData(); showToast(`« ${oldName} » renommée en « ${newName} »`, 'ok'); render();
    };
  });

  document.querySelectorAll('[data-cat-del]').forEach(b=>{
    b.onclick = async ()=>{
      const name = b.dataset.catDel;
      if(PROTECTED_CATS.includes(name)) return;
      const n = state.transactions.filter(t=>t.category===name).length
              + state.recurring.filter(r=>r.category===name).length
              + state.upcoming.filter(u=>u.category===name).length;
      const msg = n>0
        ? `Supprimer « ${escapeHTML(name)} » ?\n${n} élément(s) seront reclassés en « Non catégorisé ».`
        : `Supprimer la catégorie « ${escapeHTML(name)} » ?`;
      if(!await askConfirm(msg)) return;
      renameCategoryRefs(name, 'Non catégorisé');
      state.categories = state.categories.filter(c=>c.name!==name);
      markDeleted('cat:'+name);
      saveData(); showToast(`Catégorie « ${name} » supprimée`, 'ok'); render();
    };
  });
}

// ---------- AGENDA PARTAGÉ ----------
const EVENT_CATEGORIES = [
  {name:'Anniversaire', color:'#E8738F', icon:'🎂'},
  {name:'Fête', color:'#E8B85C', icon:'🎉'},
  {name:'Rendez-vous', color:'#6FB4E8', icon:'📅'},
  {name:'Santé', color:'#FF7E67', icon:'🩺'},
  {name:'Enfants / école', color:'#C7B08A', icon:'🎒'},
  {name:'Travail', color:'#8FA8FF', icon:'💼'},
  {name:'Vacances / week-end', color:'#45C4E0', icon:'🌴'},
  {name:'Maison', color:'#B08FE0', icon:'🏠'},
  {name:'Autre', color:'#8FA096', icon:'📌'}
];
function evCatInfo(name){
  return EVENT_CATEGORIES.find(c=>c.name===name) || EVENT_CATEGORIES[EVENT_CATEGORIES.length-1];
}
let calMonth = null; // 'YYYY-MM' affiché
let calSelDay = null; // 'YYYY-MM-DD' sélectionné
let evForm = {id:null, title:'', date:'', time:'', note:'', category:'Rendez-vous'};

function planningHTML(){
  if(!calMonth) calMonth = todayISO().slice(0,7);
  if(!calSelDay) calSelDay = todayISO();
  if(!evForm.date) evForm.date = calSelDay;

  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startOffset = (first.getDay()+6)%7; // semaine commençant lundi
  const prevDays = new Date(y, m-1, 0).getDate();
  const today = todayISO();
  const evByDay = {};
  state.events.forEach(e=>{ (evByDay[e.date] = evByDay[e.date]||[]).push(e); });

  const cells = [];
  for(let i=startOffset-1;i>=0;i--){
    const d = new Date(y, m-2, prevDays-i);
    cells.push({date:isoOf(d), num:prevDays-i, other:true});
  }
  for(let d=1;d<=daysInMonth;d++) cells.push({date:`${calMonth}-${String(d).padStart(2,'0')}`, num:d, other:false});
  while(cells.length%7!==0){
    const n = cells.length - (startOffset+daysInMonth) + 1;
    cells.push({date:isoOf(new Date(y, m, n)), num:n, other:true});
  }

  const grid = ['L','M','M','J','V','S','D'].map(d=>`<div class="cal-dow">${d}</div>`).join('') +
    cells.map(c=>{
      const evs = evByDay[c.date]||[];
      const dots = evs.slice(0,3).map(e=>`<span class="cal-dot" style="background:${evCatInfo(e.category).color}"></span>`).join('');
      return `
      <button class="cal-day ${c.other?'other':''} ${c.date===today?'today':''} ${c.date===calSelDay?'selected':''}" data-cal-day="${c.date}">
        ${c.num}
        <span class="cal-dots">${dots||'<span class="cal-dot none"></span>'}</span>
      </button>`;
    }).join('');

  const sortEv = (a,b)=> (a.time||'99').localeCompare(b.time||'99') || a.title.localeCompare(b.title);
  const dayEvents = (evByDay[calSelDay]||[]).sort(sortEv);
  const selLabel = calSelDay.split('-').reverse().join('/');
  const dayHTML = dayEvents.length ? dayEvents.map(evRowHTML).join('')
    : `<p class="muted">Rien de prévu le ${selLabel}.</p>`;

  const upcoming = state.events
    .filter(e=>e.date>=today && e.date!==calSelDay)
    .sort((a,b)=>a.date.localeCompare(b.date) || sortEv(a,b))
    .slice(0,8);
  const upcomingHTML = upcoming.length ? upcoming.map(e=>evRowHTML(e,true)).join('')
    : '<p class="muted">Aucun événement à venir.</p>';

  const editing = !!evForm.id;
  return `
    <h2 class="section-title">Agenda partagé</h2>
    <div class="card">
      <div class="cal-head">
        <button id="cal-prev">‹</button>
        <span class="cal-title">${monthLabel(calMonth)}</span>
        <button id="cal-next">›</button>
      </div>
      <div class="cal-grid">${grid}</div>
    </div>

    <h2 class="section-title">Le ${selLabel}</h2>
    <div class="card">${dayHTML}</div>

    <h2 class="section-title">À venir</h2>
    <div class="card">${upcomingHTML}</div>

    <h2 class="section-title">Pense-bête</h2>
    <div class="card">${notesHTML()}</div>

    <h2 class="section-title">${editing?'Modifier l’événement':'Nouvel événement'}</h2>
    <div class="card">
      <label style="margin-top:0;">Titre</label>
      <input type="text" id="ev-title" value="${escapeHTML(evForm.title)}" placeholder="ex: Dentiste, anniversaire, week-end…">
      <label>Catégorie</label>
      <select id="ev-cat">${EVENT_CATEGORIES.map(c=>`<option value="${c.name}" ${evForm.category===c.name?'selected':''}>${c.icon} ${c.name}</option>`).join('')}</select>
      <div style="display:flex;gap:10px;">
        <div style="flex:1.3;">
          <label>Date</label>
          <input type="date" id="ev-date" value="${evForm.date}">
        </div>
        <div style="flex:1;">
          <label>Heure (facultatif)</label>
          <input type="time" id="ev-time" value="${evForm.time}">
        </div>
      </div>
      <label>Note (facultatif)</label>
      <input type="text" id="ev-note" value="${escapeHTML(evForm.note)}" placeholder="ex: apporter le dossier, réserver avant…">
      <button class="primary" id="btn-save-ev">${editing?'Enregistrer les modifications':'Ajouter à l’agenda'}</button>
      ${editing ? `
      <button class="secondary" id="btn-cancel-ev" style="margin-top:12px;">Annuler la modification</button>
      <button class="link-danger" id="btn-del-ev" style="margin-top:14px;width:100%;text-align:center;">Supprimer cet événement</button>` : ''}
    </div>
    <p class="muted" style="text-align:center;font-size:11.5px;margin:0 0 8px;">Agenda visible et modifiable par vous deux.</p>
  `;
}
function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function evRowHTML(e, withDate){
  const c = evCatInfo(e.category);
  const when = withDate ? e.date.split('-').reverse().slice(0,2).join('/') : (e.time || '—');
  return `
  <div class="ev-row" data-ev="${e.id}">
    <span class="cat-badge" style="background:${c.color}22;color:${c.color};border:1px solid ${c.color}44;flex:none;">${c.icon}</span>
    <span class="ev-time">${withDate ? when + (e.time?' '+e.time:'') : when}</span>
    <div class="ev-body">
      <div class="t">${escapeHTML(e.title)}</div>
      <div class="n" style="color:${c.color};font-size:11px;">${c.name}</div>
      ${e.note?`<div class="n">${escapeHTML(e.note)}</div>`:''}
    </div>
  </div>`;
}

let noteInput = '';
function notesHTML(){
  const open = state.notes.filter(n=>!n.done);
  const done = state.notes.filter(n=>n.done);
  const row = n => `
    <div class="note-row">
      <button class="note-check ${n.done?'done':''}" data-note-toggle="${n.id}">${n.done?'✓':''}</button>
      <span class="note-text ${n.done?'done':''}">${escapeHTML(n.text)}</span>
      <button data-note-del="${n.id}" style="background:none;border:none;color:var(--ink-faint);font-size:16px;cursor:pointer;padding:0 0 0 6px;">×</button>
    </div>`;
  return `
    ${open.length ? open.map(row).join('') : '<p class="muted">Rien à penser pour l’instant.</p>'}
    ${done.length ? `
    <details style="margin-top:10px;">
      <summary style="cursor:pointer;font-size:12px;color:var(--ink-faint);font-weight:600;">${done.length} fait(s)</summary>
      <div style="margin-top:6px;">${done.map(row).join('')}</div>
      <button class="ghost" id="btn-clear-done" style="font-size:12px;margin-top:6px;">Effacer les faits</button>
    </details>` : ''}

      <input type="text" id="note-input" value="${escapeHTML(noteInput)}" placeholder="ex: prendre RDV garagiste, acheter cadeau…" style="flex:1;">
      <button class="primary" id="btn-add-note" style="margin-top:0;width:auto;padding:12px 16px;flex:none;">+</button>
    </div>`;
}
function attachNotesHandlers(){
  const inp = document.getElementById('note-input');
  if(inp){
    inp.oninput = e=>{ noteInput = e.target.value; };
    inp.onkeydown = e=>{ if(e.key==='Enter') addNote(); };
  }
  const addBtn = document.getElementById('btn-add-note');
  if(addBtn) addBtn.onclick = addNote;
  function addNote(){
    const text = noteInput.trim();
    if(!text){ showToast('⚠ Écrivez d’abord la note.', 'error'); return; }
    state.notes.unshift({id:uid(), text, done:false, createdAt:Date.now(), updatedAt:Date.now()});
    noteInput = '';
    saveData(); render();
    const el = document.getElementById('note-input');
    if(el) el.focus();
  }
  document.querySelectorAll('[data-note-toggle]').forEach(b=>{
    b.onclick = ()=>{
      const n = state.notes.find(x=>x.id===b.dataset.noteToggle);
      if(!n) return;
      n.done = !n.done;
      n.updatedAt = Date.now();
      saveData(); render();
    };
  });
  document.querySelectorAll('[data-note-del]').forEach(b=>{
    b.onclick = async ()=>{
      const n = state.notes.find(x=>x.id===b.dataset.noteDel);
      if(n && !n.done && !await askConfirm('Supprimer cette note ?')) return;
      state.notes = state.notes.filter(x=>x.id!==b.dataset.noteDel);
      markDeleted(b.dataset.noteDel);
      saveData(); render();
    };
  });
  const clearBtn = document.getElementById('btn-clear-done');
  if(clearBtn) clearBtn.onclick = ()=>{
    state.notes.filter(n=>n.done).forEach(n=>markDeleted(n.id));
    state.notes = state.notes.filter(n=>!n.done);
    saveData(); render();
  };
}

function parseUserAmount(v){
  if(v==null || v==='') return 0;
  const n = parseFloat(String(v).replace(/\s/g,'').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

// Met à jour uniquement le bloc de contrôle somme/écart, sans toucher aux champs
function updateDetailCheck(){
  const f = addFormState;
  const box = document.getElementById('detail-check');
  if(!box) return;
  if(f.details.length===0){ box.innerHTML=''; return; }
  const detailSum = f.details.reduce((s,d)=>s+parseUserAmount(d.amount),0);
  const totalNum = parseUserAmount(f.amount);
  const mismatch = Math.abs(detailSum-totalNum) > 0.009;
  box.innerHTML = `
    <div class="detail-sum"><span>Somme des lignes</span><span>${fmt(detailSum)}</span></div>
    ${mismatch ? `<div class="banner warn">La somme des lignes (${fmt(detailSum)}) ne correspond pas au montant total (${fmt(totalNum)}).</div>` : ''}`;
}

function exportJSON(){
  try{
    const dump = {app:'budget-backup', exportedAt:new Date().toISOString(), ...payload()};
    const blob = new Blob([JSON.stringify(dump, null, 1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `budget-sauvegarde-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    showToast('Sauvegarde JSON générée', 'ok');
  }catch(e){
    console.error(e);
    showToast('⚠ La sauvegarde JSON a échoué.', 'error');
  }
}

function handleRestoreJSON(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    try{
      const parsed = JSON.parse(evt.target.result);
      if(parsed.app!=='budget-backup' || !Array.isArray(parsed.transactions)){
        showToast('⚠ Ce fichier n’est pas une sauvegarde JSON de cette appli.', 'error');
        return;
      }
      const data = normalizeData(parsed);
      const n = data.transactions.length;
      const ok = await askConfirm(
        `Restaurer cette sauvegarde (${n} opération(s), datée du ${(parsed.exportedAt||'?').slice(0,10)}) ?\n\n`
        + 'Elle remplace les données de cet appareil et les renvoie au stockage partagé.\n'
        + '⚠ Si l’application est encore ouverte sur l’autre appareil, ses données en mémoire peuvent revenir par fusion : fermez-la de son côté avant de restaurer, puis rouvrez-la.',
        'Restaurer'
      );
      if(!ok) return;
      state.transactions = data.transactions;
      mergeCategories(data.categories);
      state.recurring = data.recurring;
      state.upcoming = data.upcoming;
      state.reserves = data.reserves;
      state.budgets = data.budgets;
      state.events = data.events;
      state.notes = data.notes;
      state.balanceAnchor = data.balanceAnchor;
      state.deleted = data.deleted;
      loadFailed = false;
      // écriture directe sans fusion : la restauration doit écraser l'existant
      await window.storage.set('budget-data', JSON.stringify(payload()), true);
      showToast('Sauvegarde restaurée', 'ok');
      render();
    }catch(err){
      console.error(err);

    });
    document.querySelectorAll('[data-imp-cat]').forEach(sel=>{
      sel.onchange = ()=>{

        if(!line) return;
        line.category = sel.value;

// le CDN peut être bloqué (réseau d'entreprise, filtrage) : le message d'erreur
// doit pointer la vraie cause plutôt que d'accuser le fichier de l'utilisateur
function xlsxReady(){
  if(typeof XLSX === 'undefined'){
    showToast('⚠ La bibliothèque Excel n’a pas pu être chargée (CDN bloqué ou hors ligne). Réessayez sur une autre connexion.', 'error');
    return false;
  }
  return true;
}

function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!xlsxReady()){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:false});
      const sheets = {};
      wb.SheetNames.forEach(name=>{
        sheets[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
      });
      const best = pickBestSheet(wb.SheetNames, sheets);
      state.importSheets = sheets;
      state.importSheetName = best;
      state.importRaw = sheets[best];
      state.importHeaderIdx = guessHeaderRow(state.importRaw);
      autoGuessMapping(state.importRaw[state.importHeaderIdx]||[], state.importRaw.slice(state.importHeaderIdx+1));
      state.importStep = 1;
      render();
      if(wb.SheetNames.length>1) showToast(`Onglet « ${best} » sélectionné automatiquement (${wb.SheetNames.length} onglets détectés).`, 'ok');
    }catch(err){
      showToast('⚠ Impossible de lire ce fichier. Vérifiez qu’il s’agit bien d’un export .xls, .xlsx ou .csv non protégé.', 'error');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Un classeur peut contenir plusieurs onglets (ex. une synthèse + le détail des
// opérations) : prendre le premier à l'aveugle fait échouer l'import sur l'onglet
// qui n'a ni Date ni Libellé. On note chaque onglet selon la présence de ces
// colonnes et le nombre de lignes de données exploitables, et on retient le mieux noté.
function scoreSheet(rows){
  if(!Array.isArray(rows) || rows.length<2) return -1;
  const hdrIdx = guessHeaderRow(rows);
  const header = rows[hdrIdx]||[];
  const n = h=>stripAccents(String(h||'')).toLowerCase();
  const hasDate = header.some(h=>n(h).includes('date'));
  const hasDesc = header.some(h=>{const v=n(h); return v.includes('libell')||v.includes('description')||v.includes('intitule')||v.includes('motif');});
  const hasAmount = header.some(h=>{const v=n(h); return v.includes('montant')||v.includes('debit')||v.includes('credit')||v.includes('somme');});
  const dataRows = rows.length - hdrIdx - 1;
  if(!hasDate && !hasAmount) return 0; // ne ressemble pas à un relevé
  return (hasDate?10:0) + (hasDesc?10:0) + (hasAmount?10:0) + Math.min(dataRows,50);
}
function pickBestSheet(names, sheets){
  let best = names[0], bestScore = -1;
  names.forEach(name=>{
    const s = scoreSheet(sheets[name]);
    if(s>bestScore){ bestScore = s; best = name; }
  });
  return best;
}

function guessHeaderRow(rows){
  const keywords = ['date','libell','montant','debit','débit','credit','crédit','description'];
  for(let i=0;i<Math.min(10,rows.length);i++){
    const rowStr = (rows[i]||[]).join(' ').toLowerCase();
    if(keywords.some(k=>rowStr.includes(k))) return i;
  }
  return 0;
}
// Détection des colonnes par score plutôt qu'au premier mot-clé rencontré.
// « Date de l'opération » contient « opération » : la logique naïve en faisait
// la colonne Libellé et l'import repartait avec des dates en guise de marchands.
// Une colonne ne peut donc porter qu'un seul rôle, attribué au meilleur candidat.
function autoGuessMapping(headerRow, rows){
  const cand = {date:[], desc:[], amount:[], debit:[], credit:[], category:[]};
  headerRow.forEach((h,i)=>{
    const n = stripAccents(h).toLowerCase().trim();
    if(!n) return;
    const isDate = n.includes('date');
    if(isDate){
      // une date d'opération ou de comptabilisation prime sur une date de valeur
      cand.date.push({i, s: (n.includes('operation')||n.includes('comptab')) ? 3 : (n.includes('valeur') ? 1 : 2)});
    }
    if(n.includes('libell')) cand.desc.push({i, s:4});
    else if(n.includes('description')||n.includes('intitule')||n.includes('nature')||n.includes('motif')) cand.desc.push({i, s:3});
    else if(n.includes('operation') && !isDate) cand.desc.push({i, s:2});
    if(n.includes('debit'))  cand.debit.push({i, s:2});
    if(n.includes('credit')) cand.credit.push({i, s:2});
    if(n.includes('montant')||n.includes('somme')){
      cand.amount.push({i, s:(n.includes('debit')||n.includes('credit')) ? 1 : 3});
    }
    if(n.includes('categ')) cand.category.push({i, s:3});
  });
  const taken = new Set();
  const pick = list=>{
    const c = list.filter(x=>!taken.has(x.i)).sort((a,b)=>b.s-a.s)[0];
    if(!c) return null;
    taken.add(c.i);
    return c.i;
  };
  const date   = pick(cand.date);
  let   desc   = pick(cand.desc);
  const debit  = pick(cand.debit);
  const credit = pick(cand.credit);
  const amount = pick(cand.amount);
  const category = pick(cand.category);

  // en-têtes absents ou exotiques : on retient la colonne la plus « textuelle »
  if(desc===null && Array.isArray(rows)){
    const sample = rows.slice(0, 25);
    let best = null;
    headerRow.forEach((h,i)=>{
      if(taken.has(i)) return;
      let len = 0, texts = 0;
      sample.forEach(r=>{
        const v = String((r||[])[i] ?? '').trim();
        if(!v || /^[\d\s.,+-]+$/.test(v)) return;
        texts++; len += v.length;
      });
      if(texts >= sample.length/2 && (!best || len > best.len)) best = {i, len};
    });
    if(best){ desc = best.i; taken.add(best.i); }
  }

  state.importMapping.date = date;
  state.importMapping.desc = desc;
  state.importMapping.category = category;
  if(debit!==null && credit!==null){
    state.importMapping.mode='split';
    state.importMapping.debit = debit;
    state.importMapping.credit = credit;
    state.importMapping.amount = null;
  } else {
    state.importMapping.mode='single';
    state.importMapping.amount = amount;
    state.importMapping.debit = debit;
    state.importMapping.credit = credit;
  }
}

function excelDateToISO(v){
  if(v==null || v==='') return '';
  if(typeof v === 'number'){
    const d = new Date(Math.round((v-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return s;
}
function parseAmountCell(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s/g,'').replace(/€/g,'');
  s = s.replace(/\.(?=\d{3}(\D|$))/g,'');
  s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// Compare la catégorie déjà écrite dans le fichier importé aux catégories
// existantes de l'app, en ignorant accents/casse/espaces — mais sans jamais en
// créer une nouvelle à la volée : une valeur non reconnue repasse par le
// dictionnaire d'enseignes plutôt que de polluer la liste de catégories.
function matchExistingCategory(raw){
  const norm = s => stripAccents(String(s||'')).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const target = norm(raw);
  if(!target) return null;
  const found = state.categories.find(c=>norm(c.name)===target);
  return found ? found.name : null;
}
function doParseImport(){
  const map = state.importMapping;
  if(map.date==null || map.desc==null){ showToast('⚠ Merci d’indiquer les colonnes Date et Libellé.', 'error'); return; }
  if(map.mode==='single' && map.amount==null){ showToast('⚠ Merci d’indiquer la colonne Montant.', 'error'); return; }
  if(map.mode==='split' && map.debit==null && map.credit==null){ showToast('⚠ Merci d’indiquer au moins une colonne Débit ou Crédit.', 'error'); return; }
  const rows = state.importRaw.slice(state.importHeaderIdx+1);
  const parsed = [];
  rows.forEach(r=>{
    if(!r || r.every(c=>c==='' || c==null)) return;
    const dateVal = r[map.date];
    const descVal = r[map.desc];
    let amount = 0;
    if(map.mode==='single'){
      amount = parseAmountCell(r[map.amount]);
    } else {
      const deb = map.debit!=null ? parseAmountCell(r[map.debit]) : 0;
      const cred = map.credit!=null ? parseAmountCell(r[map.credit]) : 0;
      amount = cred - Math.abs(deb);
    }
    if(!dateVal && !amount) return;
    const iso = excelDateToISO(dateVal);
    if(!iso || amount===0) return;
    const categVal = map.category!=null ? String(r[map.category]||'').trim() : '';
    parsed.push({date:iso, description:String(descVal||'').trim(), amount, importedCategory:categVal});
  });
  if(!parsed.length){
    showToast('⚠ Aucune ligne exploitable avec ces colonnes. Vérifiez la ligne d’en-tête et les colonnes choisies.', 'error');
    return;
  }
  parsed.sort((a,b)=>a.date.localeCompare(b.date));
  reconcileParsed(parsed);
  // classement automatique des seules lignes qui deviendront de nouvelles opérations
  const ctx = {hist: buildHistoryIndex()};
  parsed.forEach(p=>{
    if(p.status !== 'new') return;
    // le fichier importé porte parfois déjà une catégorie (relevé retravaillé
    // à la main) : on la reprend telle quelle si elle correspond à une catégorie
    // existante, plutôt que de la re-deviner via le dictionnaire d'enseignes
    const fileCat = p.importedCategory ? matchExistingCategory(p.importedCategory) : null;
    if(fileCat){
      p.category = fileCat;
      p.why = 'déjà catégorisé dans le fichier';
      p.level = 'sure';
    } else {
      const g = guessCategory(p.description, p.amount, ctx);
      p.category = g.category;
      p.why = g.why;
      p.level = g.level;
    }
  });
  state.importParsed = parsed;
  state.importStep = 2;
  render();
}

// Rapprochement : cherche pour chaque ligne du relevé une opération déjà saisie.
// Le montant seul ne suffit pas — deux dépenses de 20 € à deux jours d'écart se
// rapprochaient à tort, la ligne du relevé était absorbée et l'opération réelle
// n'était jamais créée. On exige donc, comme pour les récurrents, soit un mot
// commun dans les libellés, soit une date à moins de 24 h.
function daysBetween(a,b){
  return Math.abs((new Date(a) - new Date(b)) / 86400000);
}
function reconcileParsed(parsed){
  const usedTx = new Set();
  // comptage des doublons : si le relevé contient 2 lignes identiques et que
  // l'app en a déjà 1, une seule est marquée doublon, l'autre est traitée normalement
  const dupeKey = t => `${t.date}|${t.amount.toFixed(2)}|${(t.description||'').toLowerCase()}`;
  const existingCounts = new Map();
  state.transactions.forEach(t=>{
    const k = dupeKey(t);
    existingCounts.set(k, (existingCounts.get(k)||0)+1);
  });
  parsed.forEach(p=>{
    // doublon strict d'un import précédent (consomme un exemplaire)
    const k = dupeKey(p);
    if((existingCounts.get(k)||0) > 0){
      existingCounts.set(k, existingCounts.get(k)-1);
      p.status='dupe';
      return;
    }
    // correspondance avec une saisie manuelle
    const pTokens = labelTokens(p.description);
    let match = null, bestScore = -1;
    state.transactions.forEach(t=>{
      if(usedTx.has(t.id) || t.source==='import') return;
      if(Math.abs(t.amount-p.amount) >= 0.005) return;
      const gap = daysBetween(t.date, p.date);
      if(gap > 3) return;
      const tok = labelTokens(t.description).some(w=>pTokens.includes(w));
      if(!tok && gap > 1) return;             // trop incertain pour rapprocher
      const score = (tok ? 100 : 0) + (3 - gap);
      if(score > bestScore){ bestScore = score; match = t; }
    });
    if(match){
      usedTx.add(match.id);
      p.status='matched';
      p.matchId=match.id;
      p.matchDesc=match.description;
      p.matchCat=match.category;
    } else {
      p.status='new';
    }
  });
}

function confirmImport(){
  let added=0, matched=0, skipped=0, classified=0, unknown=0;
  state.importParsed.forEach(p=>{
    if(p.status==='dupe'){ skipped++; return; }
    if(p.status==='matched'){
      const tx = state.transactions.find(t=>t.id===p.matchId);
      if(tx){ tx.reconciled = true; tx.updatedAt = Date.now(); } // pointé : confirmé par le relevé bancaire
      matched++;
      return;
    }
    const cat = p.category || 'À catégoriser';
    if(cat==='À catégoriser') unknown++; else classified++;
    state.transactions.push({
      id: uid(), date:p.date, amount:p.amount, category:cat,
      description:p.description, details:[], source:'import',
      autoCat: p.why || '', createdAt:Date.now(), updatedAt:Date.now()
    });
    added++;
  });
  saveData();
  const newDates = [];
  state.importParsed.forEach(p=>{ if(p.status==='new') newDates.push(p.date); });
  const dateMin = newDates.length ? newDates.sort()[0] : null;
  const dateMax = newDates.length ? newDates.sort().reverse()[0] : null;
  state.importResult = {added, matched, skipped, classified, unknown, dateMin, dateMax};
  importOnlyUnknown = false;
  state.importStep = 3;
  render();
}

// Dans un artifact Claude, window.storage existe déjà. Hébergée ailleurs (GitHub
// Pages, Netlify…), on le remplace par Supabase. Le "code du foyer" est le secret
// partagé : vous deux saisissez le même code sur chacun de vos appareils, et lui
// seul ouvre l'accès aux données côté serveur. Voir le SQL d'installation
// (table foyer_kv + fonctions foyer_get / foyer_set) livré avec ce fichier.
const SUPABASE_URL = 'https://xziremnnscfjcfexfgoy.supabase.co';
// Clé publique côté navigateur : sb_publishable_... (ou l'ancienne clé anon,
// dépréciée fin 2026). Elle est lisible par tout le monde et c'est normal :
// c'est la RLS + le code du foyer qui protègent les données, pas cette clé.
const SUPABASE_ANON_KEY = 'sb_publishable_d3UY4Vh4NsG3nHrSo9c6GQ_CxPBgTEH';

// Le code n'est plus un simple préfixe de clé : côté Supabase, c'est le seul
// secret qui ouvre l'accès aux données. Il doit donc être long.
const FOYER_CODE_MIN = 12;
async function ensureFoyerCode(){
  const saved = localStorage.getItem('foyer-code');
  if(saved && saved.trim().length >= FOYER_CODE_MIN) return saved.trim();
  // annuler doit être possible : la boucle infinie de modales rendait l'app
  // inutilisable dès qu'on fermait la fenêtre de saisie
  const input = await askInput({
    title:'Code du foyer',
    message:`Choisissez un code commun : le même pour vous deux, sur tous vos appareils. C'est lui — et lui seul — qui protège l'accès à vos données : ${FOYER_CODE_MIN} caractères minimum, impossible à deviner. Notez-le, il n'est récupérable nulle part.`,
    placeholder:'ex: hirondelles-du-44-2026',
    value: saved || ''
  });
  if(input===null || !input.trim()) throw new Error('Code du foyer non renseigné.');
  const code = input.trim();
  if(code.length < FOYER_CODE_MIN){
    throw new Error(`Code du foyer trop court : ${FOYER_CODE_MIN} caractères minimum.`);
  }
  localStorage.setItem('foyer-code', code);
  return code;
}

if(!window.storage){
  const sbHeaders = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };
  // la clé passe AUSSI en paramètre d'URL : certains réseaux d'entreprise
  // retirent les en-têtes personnalisés (cause des échecs de sync du Suivi EPI)
  const sbQS = 'apikey=' + encodeURIComponent(SUPABASE_ANON_KEY);

  // On ne touche JAMAIS la table en direct : elle est fermée par RLS. Tout passe
  // par deux fonctions SECURITY DEFINER qui exigent le code du foyer. Sans lui,
  // la clé anon — publique par nature, lisible dans le source — ne donne rien.
  async function rpc(fn, body){
    if(SUPABASE_URL.includes('VOTRE')) throw new Error('Supabase non configuré : renseignez SUPABASE_URL et SUPABASE_ANON_KEY en tête du script.');
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}?${sbQS}`, {
      method:'POST', headers:sbHeaders, body:JSON.stringify(body)
    });
    if(!r.ok){
      let detail = '';
      try{ detail = (await r.json()).message || ''; }catch(e){}
      throw new Error(`${fn} a échoué (${r.status})${detail ? ' : ' + detail : ''}`);
    }
    if(r.status === 204) return null;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }

  window.storage = {
    async get(key){
      const code = await ensureFoyerCode();
      const v = await rpc('foyer_get', {p_code:code, p_key:key});
      if(v == null) return null;
      return {key, value:v, shared:true};
    },
    async set(key, value){
      const code = await ensureFoyerCode();
      await rpc('foyer_set', {p_code:code, p_key:key, p_value:value});
      return {key, value, shared:true};
    }
  };
}

// Quand on revient sur l'app (l'autre a pu modifier entre-temps), on recharge et fusionne
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && state.loaded) loadData();
});

loadData();
})();
</script>
