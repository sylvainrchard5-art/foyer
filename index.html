<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foyer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C120F">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- iOS ignore le manifeste : c'est cette balise qui donne l'icône de l'écran d'accueil -->
<link rel="apple-touch-icon" href="icon-192.png">
<title>Foyer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
  integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#0C120F;
    --bg-soft:#111915;
    --card:#161F1A;
    --card-2:#1C2620;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.13);
    --ink:#F2F5F1;
    --ink-soft:#8FA096;
    --ink-faint:#5C6B62;
    --mint:#5EE2A0;
    --mint-deep:#1F7A50;
    --coral:#FF7E67;
    --gold:#E8B85C;
    --sky:#6FB4E8;
    --lilac:#B08FE0;
    --rose:#E883A8;
    --sand:#C7B08A;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:110px;
    position:relative;
  }
  /* halo d'ambiance en haut */
  #app::before{
    content:'';
    position:absolute;top:-140px;left:50%;transform:translateX(-50%);
    width:420px;height:340px;
    background:radial-gradient(closest-side, rgba(94,226,160,.16), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  header.top{
    padding:34px 22px 10px;
    position:relative;
    z-index:1;
  }
  header.top .brand{
    font-family:'Sora',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 18px;
  }
  header.top .balance-label{
    font-size:12px;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.04em;
  }
  header.top .balance{
    font-family:'Sora',sans-serif;
    font-size:46px;
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1;
    margin:0;
  }
  header.top .balance .cents{font-size:24px;font-weight:600;color:var(--ink-soft);}
  header.top .flow-row{
    display:flex;gap:10px;margin-top:20px;
  }
  .flow-chip{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .flow-chip .tag{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:5px;
  }
  .flow-chip .tag .arrow{font-size:13px;}
  .flow-chip .val{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;font-weight:700;
  }
  .flow-chip.in .val{color:var(--mint);}
  .flow-chip.out .val{color:var(--coral);}

  main{flex:1;padding:22px 18px 8px;position:relative;z-index:1;}

  h2.section-title{
    font-family:'Sora',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:8px 2px 14px;
    display:flex;align-items:center;gap:10px;
  }
  h2.section-title::after{
    content:'';flex:1;height:1px;background:var(--line-strong);
  }

  .card{
    background:linear-gradient(160deg, var(--card-2), var(--card));
    border-radius:var(--radius);
    padding:20px 18px;
    margin-bottom:18px;
    border:1px solid var(--line);
  }
  .muted{color:var(--ink-soft);font-size:13px;line-height:1.5;}

  /* donut */
  .donut-wrap{display:flex;justify-content:center;padding:6px 0 22px;}
  .donut{
    width:196px;height:196px;border-radius:50%;position:relative;flex-shrink:0;
    filter:drop-shadow(0 0 24px rgba(94,226,160,.12));
  }
  .donut-hole{
    position:absolute;inset:22px;
    background:var(--card);
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .donut-total{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .donut-label{font-size:10px;color:var(--ink-faint);margin-top:4px;text-transform:uppercase;letter-spacing:.2em;}

  .legend-row{
    display:flex;align-items:center;gap:12px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .legend-row:last-child{border-bottom:none;padding-bottom:2px;}
  .legend-row .chip{
    width:12px;height:12px;border-radius:4px;flex-shrink:0;
  }
  .legend-row .label{font-size:14px;flex:1;font-weight:500;}
  .legend-row .pct{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);
    background:var(--bg-soft);border:1px solid var(--line);border-radius:6px;
    padding:2px 6px;
  }
  .legend-row .amt{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;width:78px;text-align:right;}

  /* ledger */
  .ledger-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .cat-badge{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-size:14px;font-weight:700;
  }
  .ledger-row .info{flex:1;min-width:0;}
  .ledger-row .desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ledger-row .meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
  .ledger-row .amount{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;flex-shrink:0;}
  .amount.neg{color:var(--coral);}
  .amount.pos{color:var(--mint);}

  /* forms */
  label{display:block;font-size:11.5px;color:var(--ink-soft);margin:16px 0 7px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--line-strong);
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    background:var(--bg-soft);
    color:var(--ink);
    color-scheme:dark;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:1px;border-color:transparent;}
  ::placeholder{color:var(--ink-faint);}

  .toggle-group{display:flex;gap:10px;}
  .toggle-btn{
    flex:1;padding:13px;border-radius:12px;border:1px solid var(--line-strong);
    background:var(--bg-soft);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .toggle-btn.active-exp{background:rgba(255,126,103,.12);border-color:var(--coral);color:var(--coral);}
  .toggle-btn.active-inc{background:rgba(94,226,160,.1);border-color:var(--mint);color:var(--mint);}

  button.primary{
    width:100%;padding:15px;border:none;border-radius:14px;
    background:var(--mint);color:#0A1410;font-size:15px;font-weight:700;
    cursor:pointer;margin-top:20px;font-family:'Sora',sans-serif;
    box-shadow:0 6px 24px -6px rgba(94,226,160,.45);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.primary:active{transform:scale(.98);box-shadow:0 2px 10px -4px rgba(94,226,160,.4);}
  button.secondary{
    width:100%;padding:13px;border:1px solid var(--line-strong);border-radius:14px;
    background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:transform .12s ease;
  }
  button.secondary:active{transform:scale(.98);}
  button.ghost{
    border:none;background:none;color:var(--mint);font-size:13px;font-weight:600;cursor:pointer;padding:8px 0;
    font-family:'Inter',sans-serif;
  }
  button.link-danger{
    border:none;background:none;color:var(--coral);font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }

  .detail-line{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .detail-line input{flex:1;}
  .detail-line input.amt-in{max-width:96px;flex:none;font-family:'JetBrains Mono',monospace;}
  .detail-line .rm{
    background:var(--bg-soft);border:1px solid var(--line-strong);border-radius:10px;
    color:var(--coral);font-size:16px;cursor:pointer;width:36px;height:44px;flex-shrink:0;
  }
  .detail-sum{
    display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
    font-size:13px;padding:10px 0 2px;border-top:1px solid var(--line-strong);margin-top:8px;color:var(--ink-soft);
  }
  .detail-sum span:last-child{color:var(--ink);font-weight:700;}

  /* nav flottante */
  nav.bottom{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    width:calc(100% - 28px);max-width:492px;
    background:rgba(22,31,26,.92);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line-strong);
    border-radius:22px;
    display:flex;
    padding:8px;
    z-index:10;
    box-shadow:0 12px 34px -8px rgba(0,0,0,.55);
  }
  nav.bottom button{
    flex:1;background:none;border:none;padding:9px 0 8px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--ink-faint);font-family:'Inter',sans-serif;font-size:9.5px;font-weight:600;cursor:pointer;
    border-radius:15px;
    transition:all .18s ease;
  }
  nav.bottom button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;}
  nav.bottom button.active{
    color:#0A1410;
    background:var(--mint);
    box-shadow:0 4px 16px -4px rgba(94,226,160,.5);
  }
  nav.bottom button.active svg{stroke-width:2.1;}

  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .filters select, .filters input{flex:1;min-width:110px;padding:10px 12px;font-size:13px;}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-soft);}

  /* ===== Le mois : ligne de vie, jauge, statuts ===== */
  .mois-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin-bottom:2px;
  }
  .mois-eyebrow{
    font-family:'Sora',sans-serif;font-size:10.5px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);
  }
  .mois-big{
    font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-.02em;
    font-size:34px;line-height:1.05;margin:6px 0 0;
  }
  .mois-big .cents{font-size:17px;font-weight:600;opacity:.65;}
  .mois-sub{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.55;}

  /* la silhouette du mois : une barre par jour de prélèvement, hauteur = montant */
  .ligne-mois{
    position:relative;
    height:104px;
    margin:24px 0 6px;
  }
  .ligne-rail{
    position:absolute;left:0;right:0;bottom:22px;height:1px;
    background:var(--line-strong);
  }
  .ligne-fill{
    position:absolute;left:0;bottom:22px;height:1px;
    background:var(--mint);opacity:.6;
  }
  .ligne-today{
    position:absolute;bottom:22px;top:0;width:1px;
    background:linear-gradient(var(--mint),rgba(94,226,160,.15));
    opacity:.5;
  }
  .ligne-today span{
    position:absolute;top:-2px;left:-15px;width:30px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:8.5px;
    letter-spacing:.08em;color:var(--mint);
  }
  .bar{
    position:absolute;bottom:22px;width:7px;margin-left:-3.5px;
    border-radius:3px 3px 0 0;
    background:var(--mint);
    cursor:pointer;
  }
  .bar.todo{
    background:linear-gradient(var(--coral),rgba(255,126,103,.25));
  }
  .bar.maybe{background:var(--sky);}
  .bar-amt{
    position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
    color:var(--ink-soft);white-space:nowrap;
  }
  .ligne-day{
    position:absolute;bottom:6px;
    font-family:'JetBrains Mono',monospace;font-size:9.5px;
    color:var(--ink-faint);transform:translateX(-50%);
    white-space:nowrap;
  }
  .ligne-legend{
    display:flex;flex-wrap:wrap;gap:14px;margin-top:4px;
    font-size:11px;color:var(--ink-soft);
  }
  .ligne-legend i{
    display:inline-block;width:8px;height:8px;border-radius:2px;
    margin-right:5px;vertical-align:middle;
  }

  /* jauge subi / arbitrable */
  .jauge{
    display:flex;height:10px;border-radius:6px;overflow:hidden;
    background:var(--card-2);margin:6px 0 10px;
  }
  .jauge span{display:block;height:100%;}

  /* lignes de charges */
  .chg{
    display:flex;align-items:center;gap:11px;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .chg:last-child{border-bottom:none;}
  .chg-day{
    flex:none;width:34px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    color:var(--ink-faint);
  }
  .chg-body{flex:1;min-width:0;}
  .chg-label{
    font-size:13.5px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chg-state{font-size:10.5px;letter-spacing:.03em;margin-top:2px;}
  .chg-amt{
    flex:none;font-family:'JetBrains Mono',monospace;
    font-size:13px;font-weight:700;
  }
  .chg.todo .chg-label{color:var(--ink);}
  .chg.done .chg-label{color:var(--ink-soft);}
  .chg.done .chg-amt{color:var(--ink-faint);}

  /* plafonds du mois */
  .plaf-line{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .plaf-lab{font-size:13px;color:var(--ink-soft);}
  .plaf-note{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .plaf-val{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;}
  .plaf-total{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 0 2px;
  }
  .plaf-cat{padding:13px 0;border-bottom:1px solid var(--line);position:relative;}
  .plaf-cat:last-child{border-bottom:none;}
  .plaf-cat-top{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:6px;padding-right:62px;
  }
  .plaf-cat-name{
    font-size:13px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .plaf-cat-val{
    flex:none;font-family:'JetBrains Mono',monospace;
    font-size:12.5px;font-weight:700;
  }
  .plaf-rail{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;}
  .plaf-fill{height:100%;border-radius:3px;}
  .plaf-cat-foot{font-size:11px;margin-top:5px;color:var(--ink-faint);}
  .plaf-edit{
    position:absolute;top:10px;right:0;width:auto;margin:0;
    padding:5px 10px;font-size:11px;
    background:var(--card-2);color:var(--ink-soft);
    border:1px solid var(--line-strong);border-radius:8px;
  }

  /* détail d'une catégorie */
  .legend-row.drillable{cursor:pointer;}
  .legend-row.drillable:active{opacity:.6;}
  .drill-arrow{
    flex:none;margin-left:6px;color:var(--ink-faint);
    font-size:17px;line-height:1;
  }
  .drill-mois{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 0 8px;margin-top:4px;
    border-bottom:1px solid var(--line-strong);
    font-family:'Sora',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  }
  .drill-row{padding:11px 0;border-bottom:1px solid var(--line);}
  .drill-row:last-child{border-bottom:none;}
  .drill-line{display:flex;align-items:baseline;gap:9px;}
  .drill-date{
    flex:none;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-faint);
  }
  .drill-desc{
    flex:1;min-width:0;font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .drill-amt{
    flex:none;font-family:'JetBrains Mono',monospace;
    font-size:12.5px;font-weight:700;color:var(--coral);
  }
  select.drill-cat{
    width:auto;max-width:60%;margin:6px 0 0 auto;display:block;
    padding:6px 26px 6px 10px;
    font-size:11.5px;background-color:var(--card-2);
    color:var(--ink-soft);
  }

  /* barres empilées : un mois par ligne, segments = catégories */
  .mrow{margin-bottom:14px;}
  .mrow:last-of-type{margin-bottom:6px;}
  .mrow-top{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:6px;
  }
  .mrow-mois{font-size:12.5px;color:var(--ink);text-transform:capitalize;}
  .mrow-tot{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    font-weight:700;color:var(--ink-soft);
  }
  .mrow-rail{height:14px;border-radius:4px;background:var(--card-2);overflow:hidden;}
  .mrow-stack{display:flex;height:100%;border-radius:4px;overflow:hidden;}
  /* un filet sombre entre segments : sans lui, deux catégories de teintes voisines
     (deux oranges par exemple) se lisent comme un seul bloc */
  .mrow-stack span{display:block;height:100%;box-shadow:inset -1px 0 0 var(--card);}
  .mrow-stack span:last-child{box-shadow:none;}

  /* barres par catégorie */
  .catbar{margin:0 0 13px;}
  .catbar-top{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;margin-bottom:5px;
  }
  .catbar-name{
    font-size:12.5px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .catbar-val{
    flex:none;font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:700;color:var(--ink-soft);
  }
  .catbar-rail{height:5px;border-radius:3px;background:var(--card-2);overflow:hidden;}
  .catbar-fill{height:100%;border-radius:3px;}

  @media (prefers-reduced-motion: reduce){
    .pt{transition:none;}
  }
  .empty .big{font-family:'Sora',sans-serif;font-size:16px;color:var(--ink);margin-bottom:6px;}

  table.preview{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px;}
  table.preview th{text-align:left;padding:7px 4px;color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--line-strong);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
  table.preview td{padding:8px 4px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;}

  .banner{
    background:rgba(111,180,232,.1);border:1px solid rgba(111,180,232,.3);
    color:var(--sky);border-radius:12px;padding:11px 13px;font-size:13px;margin:14px 0 0;line-height:1.45;
  }
  .banner.warn{background:rgba(255,126,103,.08);border-color:rgba(255,126,103,.35);color:var(--coral);}
  .banner.ok{background:rgba(94,226,160,.08);border-color:rgba(94,226,160,.35);color:var(--mint);}
  .card .banner:first-child{margin-top:0;}

  ::-webkit-scrollbar{display:none;}
  /* ---- gestion des catégories ---- */
  .cat-mgr-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .cat-mgr-row:last-of-type{border-bottom:none;}

  .note-text.done{color:var(--ink-faint);text-decoration:line-through;}

  /* ---- modales (remplacent prompt/confirm, bloqués dans l'artifact) ---- */
  #app-modal{
    position:fixed;inset:0;z-index:200;
    background:rgba(5,9,7,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:22px;
  }
  #app-modal .modal-card{
    width:100%;max-width:400px;

  }

    font-family:'Sora',sans-serif;font-size:16px;font-weight:700;margin:0 0 10px;

  #app-modal .modal-msg{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px;white-space:pre-line;}
  #app-modal input[type=text]{width:100%;}

  #app-modal .modal-actions button{flex:1;margin-top:0;}
  #app-modal button.primary.danger{background:var(--coral);box-shadow:0 4px 18px -6px rgba(255,126,103,.5);}

  /* --- vérification avant import --- */
  .imp-row{padding:11px 0;border-bottom:1px solid var(--line);}
  .imp-row.unknown{background:rgba(255,126,103,.06);border-radius:12px;margin:0 -8px;padding-left:8px;padding-right:8px;}
  .imp-head{display:flex;align-items:baseline;gap:8px;}
  .imp-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);flex:none;}
  .imp-desc{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .imp-amt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;flex:none;}
  .imp-cat{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .imp-cat select{margin:0;flex:1;padding:8px 10px;font-size:12.5px;}
  .imp-why{font-size:10.5px;flex:none;max-width:42%;text-align:right;line-height:1.3;}
  .imp-toolbar{display:flex;gap:8px;margin:14px 0 4px;}
  .imp-toolbar button{margin-top:0;flex:1;padding:9px 4px;font-size:12px;}
</style>

<body>
<div id="app"></div>

<script>
(function(){

const DEFAULT_CATEGORIES = [
  {name:'Alimentation (courses)', color:'#5EE2A0'},
  {name:'Boulangerie / Café / Snacking quotidien', color:'#F2C14E'},
  {name:'Restaurants / Bars / Sorties', color:'#FFA94D'},
  {name:'Recharge véhicule électrique / Carburant', color:'#7FD4D4'},
  {name:'Transport (train/bus/parking)', color:'#6FB4E8'},
  {name:'Habillement / Beauté', color:'#E883A8'},
  {name:'Sport / Loisirs / Abonnements', color:'#E8B85C'},
  {name:'Télécom / Abonnements num.', color:'#9AA5E8'},
  {name:'Logement / Charges', color:'#B08FE0'},
  {name:'Bricolage / Maison', color:'#C9A66B'},
  {name:'Assurances / Mutuelle', color:'#8FA8FF'},
  {name:'Prêts / Crédits', color:'#F0A868'},
  {name:'Impôts / Taxes locales', color:'#C97BD4'},
  {name:'Santé / Bien-être', color:'#FF7E67'},
  {name:'Vacances / Ski', color:'#45C4E0'},
  {name:'Enfants / Ecole / Activités', color:'#C7B08A'},
  {name:'Shopping en ligne / Divers', color:'#D4A5FF'},
  {name:'Presse / Librairie', color:'#74A69A'},
  {name:'Frais postaux', color:'#B5C99A'},
  {name:'Frais bancaires', color:'#A0A8B8'},
  {name:'Retraits espèces', color:'#9E9E9E'},
  {name:'Chèques émis', color:'#7B8794'},
  {name:'Virements émis (tiers)', color:'#E8738F'},
  {name:'Virements internes / Lydia (épargne interne)', color:'#8FE3C8'},
  {name:'Virements reçus / Revenus', color:'#3F8F5F'},
  {name:'Non catégorisé', color:'#8FA096'},
  {name:'À catégoriser', color:'#5C6B62'}
];

// L'épargne n'est pas une dépense : un virement vers un livret (ou vers les
// enveloppes Lydia) sort du compte courant mais reste votre argent. Il doit
// donc peser sur le solde, jamais sur les statistiques de dépenses ni sur
// l'estimation du train de vie.
const SAVINGS_CAT = 'Virements internes / Lydia (épargne interne)';
const isSavings = t => t.category === SAVINGS_CAT;

const SCHEMA_VERSION = 2;
const TOMB_TTL = 120*86400000;   // durée de vie des marqueurs de suppression

let loadFailed = false;          // lecture initiale ratée : écriture interdite

let state = {
  loaded:false,
  tab:'apercu',
  transactions:[],
  categories:DEFAULT_CATEGORIES,
  recurring:[],
  upcoming:[],
  reserves:[],     // comptes en réserve {id,label,amount} : Livret A, épargne projet…
  budgets:[],      // plafonds mensuels {category,amount,updatedAt} : ce qu'on s'autorise par poste
  events:[],       // planning partagé {id,title,date,time,note}
  notes:[],        // pense-bête partagé {id,text,done}
  balanceAnchor:{amount:0, at:0},   // solde réel constaté + date du constat
  deleted:[],      // tombstones {id,at} pour que les suppressions survivent à la fusion à deux
  importStep:0,
  importRaw:null,
  importSheets:null,
  importSheetName:null,
  importHeaderIdx:0,
  importMapping:{date:null,desc:null,amount:null,debit:null,credit:null,category:null,mode:'single'},
  importParsed:[],
  importResult:null,
  historyFilters:{month:'all',cat:'all',q:''}
};

function catInfo(name){
  return state.categories.find(c=>c.name===name) || {name:name||'Non catégorisé', color:'#8FA096'};
}
function fmt(n){
  const s = Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-':'') + s + ' €';
}
function fmtSplit(n){
  const abs = Math.abs(n);
  const ent = Math.floor(abs).toLocaleString('fr-FR');
  const cents = Math.round((abs-Math.floor(abs))*100).toString().padStart(2,'0');
  return {sign:n<0?'-':'', ent, cents};
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function monthKey(d){ return (d||'').slice(0,7); }
function monthLabel(key){
  if(!key) return '';
  const [y,m] = key.split('-');
  const names = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return names[parseInt(m,10)-1] + ' ' + y;
}
function uid(){ return 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function escapeHTML(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function purgeTombstones(list){
  const cutoff = Date.now() - TOMB_TTL;
  return (list||[]).filter(d=>d && d.id && (d.at||0) > cutoff);
}
function catTombstones(){
  return new Set((state.deleted||[]).filter(d=>String(d.id).startsWith('cat:')).map(d=>String(d.id).slice(4)));
}
function mergeCategories(saved){
  const tomb = catTombstones();
  const savedNames = new Set(saved.map(c=>c.name));
  state.categories = [
    ...saved.filter(c=>c.name!=='Non catégorisé' && c.name!=='À catégoriser'),
    ...DEFAULT_CATEGORIES.filter(c=>!savedNames.has(c.name) && !tomb.has(c.name) && c.name!=='Non catégorisé' && c.name!=='À catégoriser'),
    ...DEFAULT_CATEGORIES.filter(c=>c.name==='Non catégorisé' || c.name==='À catégoriser')
  ];
}

// Fusion avec la version distante : union par id, le plus récent gagne,
// les suppressions (tombstones) sont respectées des deux côtés.
function mergeRemote(remote){
  const tomb = {};
  (remote.deleted||[]).concat(state.deleted||[]).forEach(d=>{ tomb[d.id] = Math.max(tomb[d.id]||0, d.at||0); });
  state.deleted = purgeTombstones(Object.entries(tomb).map(([id,at])=>({id,at})));
  const mergeColl = (localArr, remoteArr)=>{
    const byId = new Map();
    (remoteArr||[]).forEach(x=>{ if(x && x.id) byId.set(x.id, x); });
    (localArr||[]).forEach(x=>{
      if(!x || !x.id) return;
      const r = byId.get(x.id);
      if(!r || (x.updatedAt||x.createdAt||0) >= (r.updatedAt||r.createdAt||0)) byId.set(x.id, x);
    });
    return Array.from(byId.values()).filter(x=>!tomb[x.id]);
  };
  state.transactions = mergeColl(state.transactions, remote.transactions);
  state.recurring   = mergeColl(state.recurring,   remote.recurring);
  state.upcoming    = mergeColl(state.upcoming,    remote.upcoming);
  state.reserves    = mergeColl(state.reserves,    remote.reserves);
  // plafonds : clé = catégorie (pas d'id), le plus récemment modifié l'emporte
  const bByCat = new Map();
  (remote.budgets||[]).forEach(b=>{ if(b && b.category) bByCat.set(b.category, b); });
  (state.budgets||[]).forEach(b=>{
    if(!b || !b.category) return;
    const r = bByCat.get(b.category);
    if(!r || (b.updatedAt||0) >= (r.updatedAt||0)) bByCat.set(b.category, b);
  });
  state.budgets = [...bByCat.values()].filter(b=>b.amount>0);
  state.events      = mergeColl(state.events,      remote.events);
  state.notes       = mergeColl(state.notes,       remote.notes);
  // catégories : union par nom (celles ajoutées par l'autre sont conservées)
  const cTomb = catTombstones();
  const byName = new Map();
  (remote.categories||[]).forEach(c=>{ if(c && c.name) byName.set(c.name, c); });
  (state.categories||[]).forEach(c=>{
    if(!c || !c.name) return;
    const r = byName.get(c.name);
    if(!r || (c.updatedAt||0) >= (r.updatedAt||0)) byName.set(c.name, c);
  });
  const cats = Array.from(byName.values()).filter(c=>!cTomb.has(c.name));
  if(!cats.some(c=>c.name==='Non catégorisé')) cats.push({name:'Non catégorisé', color:'#8FA096'});
  if(!cats.some(c=>c.name==='À catégoriser')) cats.push({name:'À catégoriser', color:'#5C6B62'});
  state.categories = [
    ...cats.filter(c=>c.name!=='Non catégorisé' && c.name!=='À catégoriser'),
    ...cats.filter(c=>c.name==='Non catégorisé' || c.name==='À catégoriser')
  ];
  const ra = remote.balanceAnchor;
  const la = state.balanceAnchor || {amount:0, at:0};
  if(ra && (ra.at||0) > (la.at||0)){
    state.balanceAnchor = {amount:ra.amount||0, at:ra.at||0};
  }
}

// Validation et migration du payload distant. Un champ corrompu ne doit ni
// vider l'application ni faire planter le rendu.
function normalizeData(raw){
  const arr = v => Array.isArray(v) ? v : [];
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
  const str = v => typeof v === 'string' ? v : '';
  const d = {
    transactions: arr(raw.transactions)
      .filter(t=>t && t.id && typeof t.date === 'string')
      .map(t=>({...t, amount:num(t.amount), category:str(t.category)||'Non catégorisé', details:arr(t.details)})),
    categories: arr(raw.categories).filter(c=>c && typeof c.name === 'string' && c.name.trim()),
    recurring: arr(raw.recurring).filter(r=>r && r.id)
      .map(r=>({...r, amount:num(r.amount), marks:(r.marks && typeof r.marks==='object') ? r.marks : {}})),
    upcoming: arr(raw.upcoming).filter(u=>u && u.id && typeof u.date === 'string')
      .map(u=>({...u, amount:num(u.amount)})),
    reserves: arr(raw.reserves).filter(r=>r && r.id).map(r=>({...r, amount:num(r.amount)})),
    // plafonds mensuels par catégorie : une seule entrée par catégorie, montant positif
    budgets: arr(raw.budgets).filter(b=>b && typeof b.category === 'string' && b.category.trim())
      .map(b=>({category:b.category, amount:Math.abs(num(b.amount)), updatedAt:num(b.updatedAt)}))
      .filter(b=>b.amount>0),
    events: arr(raw.events).filter(e=>e && e.id && typeof e.date === 'string'),
    notes: arr(raw.notes).filter(n=>n && n.id && typeof n.text === 'string'),
    deleted: purgeTombstones(raw.deleted),
    balanceAnchor: {amount:0, at:0}
  };
  if(raw.balanceAnchor && typeof raw.balanceAnchor === 'object'){
    d.balanceAnchor = {amount:num(raw.balanceAnchor.amount), at:num(raw.balanceAnchor.at)};
  } else if(num(raw.startBalanceAt)){
    // migration v1 → v2 : le décalage devient un solde réel daté. Le résultat
    // affiché est identique, mais il résiste désormais à la fusion. On absorbe
    // dans l'ancre exactement ce que countsAfterAnchor exclura ensuite, sinon la
    // migration décalerait le solde de ces opérations.
    const at = num(raw.startBalanceAt);
    const day = dayOf(at);
    const before = d.transactions
      .filter(t=>!countsAfterAnchor(t, at, day))
      .reduce((sum,t)=>sum+t.amount, 0);
    d.balanceAnchor = {amount: num(raw.startBalance) + before, at};
  }
  return d;
}

function payload(){
  return {
    version:SCHEMA_VERSION,
    transactions:state.transactions,
    categories:state.categories,
    recurring:state.recurring,
    upcoming:state.upcoming,
    reserves:state.reserves,
    budgets:state.budgets,
    events:state.events,
    notes:state.notes,
    balanceAnchor:state.balanceAnchor,
    deleted:state.deleted
  };
}

async function loadData(){
  try{
    const res = await window.storage.get('budget-data', true);
    if(res && res.value){
      const parsed = normalizeData(JSON.parse(res.value));
      if(state.loaded){
        // rechargement (retour sur l'app) : on fusionne au lieu d'écraser.
        // mergeRemote fait déjà l'union des catégories : ne pas la refaire ici,
        // cela écraserait les catégories connues seulement de cet appareil.
        mergeRemote(parsed);
      } else {
        state.transactions = parsed.transactions;
        mergeCategories(parsed.categories);
        state.recurring = parsed.recurring;
        state.upcoming = parsed.upcoming;
        state.reserves = parsed.reserves;
        state.events = parsed.events;
        state.notes = parsed.notes;
        state.balanceAnchor = parsed.balanceAnchor;
        state.deleted = parsed.deleted;
      }
    }
    loadFailed = false;
  }catch(e){
    console.error('Chargement impossible', e);
    if(!state.loaded){
      // On n'a pas pu lire : surtout ne rien écrire, sinon on écrase le budget
      // distant avec un état vide.
      loadFailed = true;
      state.transactions = [];
      state.categories = DEFAULT_CATEGORIES;
      showToast('⚠ Données non chargées (réseau ?). Les modifications sont bloquées pour ne rien écraser — rechargez la page.', 'error');
    }
  }
  state.loaded = true;
  render();
}

function collSignature(){
  return [state.transactions, state.recurring, state.upcoming,
          state.reserves, state.events, state.notes, state.categories]
    .map(a=>a.length).join('|');
}

async function saveData(){
  if(loadFailed){
    showToast('⚠ Données non chargées : sauvegarde bloquée pour protéger le budget. Rechargez la page.', 'error');
    return;
  }
  try{
    const before = collSignature();
    // fusion avant écriture : si l'autre a sauvegardé entre-temps, on ne perd rien
    try{
      const res = await window.storage.get('budget-data', true);
      if(res && res.value) mergeRemote(normalizeData(JSON.parse(res.value)));
    }catch(e){ /* première sauvegarde : la clé n'existe pas encore */ }
    const result = await window.storage.set('budget-data', JSON.stringify(payload()), true);
    if(!result) throw new Error('réponse vide');
    // la fusion a pu ramener des données de l'autre appareil après le render
    if(collSignature() !== before) render();
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    showToast('⚠ La sauvegarde a échoué — vos dernières modifications ne sont pas enregistrées. Réessayez.', 'error');
  }
}

function showToast(msg, type){
  const old = document.getElementById('app-toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id = 'app-toast';
  t.textContent = msg;
  t.style.cssText = `position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
    max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;
    font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5);
    background:${type==='error'?'#3A1712':'#12301F'};
    color:${type==='error'?'#FF9C8A':'#7FE8B0'};
    border:1px solid ${type==='error'?'rgba(255,126,103,.4)':'rgba(94,226,160,.4)'};`;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, type==='error'?6000:2500);
}
// ---------- MODALES (prompt/confirm natifs bloqués dans l'artifact) ----------
function closeModal(){ const m = document.getElementById('app-modal'); if(m) m.remove(); }
function openModal(inner){
  closeModal();
  const ov = document.createElement('div');
  ov.id = 'app-modal';
  ov.innerHTML = `<div class="modal-card">${inner}</div>`;
  document.body.appendChild(ov);
  return ov;
}
function askConfirm(message, okLabel){
  return new Promise(resolve=>{
    const ov = openModal(`
      <p class="modal-msg">${message}</p>
      <div class="modal-actions">
        <button class="secondary" id="modal-cancel">Annuler</button>
        <button class="primary danger" id="modal-ok">${okLabel||'Supprimer'}</button>
      </div>`);
    const done = v => { closeModal(); resolve(v); };
    ov.querySelector('#modal-ok').onclick = ()=>done(true);
    ov.querySelector('#modal-cancel').onclick = ()=>done(false);
    ov.onclick = e => { if(e.target===ov) done(false); };
  });
}
// résout avec la chaîne saisie, ou null si annulé
function askInput(opts){
  return new Promise(resolve=>{
    const ov = openModal(`
      ${opts.title ? `<h3 class="modal-title">${opts.title}</h3>` : ''}
      ${opts.message ? `<p class="modal-msg">${opts.message}</p>` : ''}
      <input type="text" ${opts.numeric?'inputmode="decimal"':''} id="modal-input"
        value="${escapeHTML(opts.value||'')}" placeholder="${escapeHTML(opts.placeholder||'')}"
        style="font-family:'JetBrains Mono',monospace;">
      <div class="modal-actions">
        <button class="secondary" id="modal-cancel">Annuler</button>
        <button class="primary" id="modal-ok">${opts.okLabel||'Valider'}</button>
      </div>`);
    const inp = ov.querySelector('#modal-input');
    setTimeout(()=>{ inp.focus(); inp.select(); }, 60);

    ov.querySelector('#modal-ok').onclick = ()=>done(inp.value);
    inp.onkeydown = e => { if(e.key==='Enter') done(inp.value); if(e.key==='Escape') done(null); };
    ov.querySelector('#modal-cancel').onclick = ()=>done(null);
    ov.onclick = e => { if(e.target===ov) done(null); };

function render(){

  if(!state.loaded){

  }
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(active && active.id && app.contains(active)){
    focusId = active.id;
    if(typeof active.selectionStart === 'number'){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }

  app.innerHTML = (state.tab==='planning' ? '' : topHeaderHTML()) + '<main>' + tabContentHTML() + '</main>' + bottomNavHTML();

        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// Le solde s'ancre sur un solde réel constaté un jour donné. Contrairement à un
// décalage (ancien startBalance), cet ancrage reste juste après une fusion à deux.
//
// Ce qui compte, c'est la DATE de l'opération, pas le moment de sa saisie : le
// solde relevé sur l'appli bancaire contient déjà tout ce qui est daté avant le
// constat. Se fier à createdAt faisait recompter intégralement un relevé importé
// après le calage — trois mois d'opérations ajoutés une seconde fois.
function dayOf(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Le jour du constat lui-même est ambigu : impossible de savoir si l'opération
// figurait déjà au relevé. On ajoute une saisie manuelle faite après le calage
// (« je cale mon solde, puis je note mon déjeuner »), jamais une ligne importée,
// qui vient par définition du relevé déjà constaté.
function countsAfterAnchor(t, anchorAt, anchorDay){
  if(!t || !t.date) return false;
  if(t.date > anchorDay) return true;
  if(t.date < anchorDay) return false;
  return t.source !== 'import' && (t.createdAt||0) > anchorAt;
}
function currentBalance(){
  const a = state.balanceAnchor || {amount:0, at:0};
  if(!a.at) return state.transactions.reduce((s,t)=>s+t.amount,0);
  const day = dayOf(a.at);
  return a.amount + state.transactions
    .filter(t=>countsAfterAnchor(t, a.at, day))
    .reduce((s,t)=>s+t.amount, 0);
}
function thisMonthTx(){
  const mk = todayISO().slice(0,7);
  return state.transactions.filter(t=>monthKey(t.date)===mk);
}

// ---------- APERÇU ----------
// ---------- ÉVOLUTION PAR CATÉGORIE (onglet Aperçu) ----------
let apercuPeriod = 3; // nombre de mois terminés affichés

// Les N derniers mois RÉVOLUS, du plus récent au plus ancien. Le mois en cours est
// écarté : il est incomplet, le comparer à des mois pleins fausserait toute lecture.
function lastMonths(n){
  const now = new Date();
  const out = [];
  for(let i=1;i<=n;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return out;
}

const TOP_CATS = 6; // au-delà, l'empilement devient illisible et les couleurs se brouillent

// Retourne, pour la période : le total par catégorie, le détail mois par mois,
// et la tendance du dernier mois face à la moyenne des précédents.
function periodBreakdown(mks){
  const perMonth = new Map();   // mk -> Map(cat -> montant)
  const totals   = new Map();   // cat -> montant sur toute la période
  mks.forEach(mk=>perMonth.set(mk, new Map()));

  state.transactions.forEach(t=>{
    if(t.amount>=0 || isSavings(t)) return;
    const mk = monthKey(t.date);
    if(!perMonth.has(mk)) return;
    const cat = t.category || 'Non catégorisé';
    const v = Math.abs(t.amount);
    perMonth.get(mk).set(cat, (perMonth.get(mk).get(cat)||0) + v);
    totals.set(cat, (totals.get(cat)||0) + v);
  });

  const ranked = [...totals.entries()].sort((a,b)=>b[1]-a[1]);
  const keep = ranked.slice(0, TOP_CATS).map(([c])=>c);
  const keepSet = new Set(keep);
  const hasRest = ranked.length > TOP_CATS;

  // regroupement du reste sous une entrée unique, pour garder l'empilement lisible
  const segsFor = mk => {
    const m = perMonth.get(mk);
    const segs = keep.map(c=>({name:c, value:m.get(c)||0, color:catInfo(c).color}))
                     .filter(s=>s.value>0);
    if(hasRest){
      let rest = 0;
      m.forEach((v,c)=>{ if(!keepSet.has(c)) rest += v; });
      if(rest>0) segs.push({name:'Autres catégories', value:rest, color:'#5C6B62'});
    }
    return segs;
  };

  const monthTotals = mks.map(mk=>{
    let s = 0; perMonth.get(mk).forEach(v=>s+=v); return {mk, total:s, segs:segsFor(mk)};
  });

  // tendance : dernier mois révolu comparé à la moyenne des mois d'avant
  const trend = new Map();
  if(mks.length >= 2){
    const [recent, ...older] = mks;
    keep.concat(hasRest?['Autres catégories']:[]).forEach(cat=>{
      const val = cat==='Autres catégories'
        ? (segsFor(recent).find(s=>s.name===cat)?.value || 0)
        : (perMonth.get(recent).get(cat)||0);
      const prevs = older.map(mk=>cat==='Autres catégories'
        ? (segsFor(mk).find(s=>s.name===cat)?.value || 0)
        : (perMonth.get(mk).get(cat)||0));
      const avg = prevs.reduce((a,b)=>a+b,0)/prevs.length;
      if(avg > 0) trend.set(cat, Math.round((val-avg)/avg*100));
    });
  }

  const grand = [...totals.values()].reduce((a,b)=>a+b,0);
  const legend = keep.map(c=>({name:c, total:totals.get(c), color:catInfo(c).color}));
  if(hasRest){
    const rest = ranked.slice(TOP_CATS).reduce((s,[,v])=>s+v,0);
    if(rest>0) legend.push({name:'Autres catégories', total:rest, color:'#5C6B62'});
  }
  return {monthTotals, legend, grand, trend, nMonths:mks.length};
}

function evolutionHTML(){
  const mks = lastMonths(apercuPeriod);
  const b = periodBreakdown(mks);
  const btns = [1,3,6].map(n=>
    `<button type="button" class="toggle-btn ${apercuPeriod===n?'active-inc':''}" data-period="${n}">${n} mois</button>`
  ).join('');

  if(b.grand===0){
    return `<div class="toggle-group" style="margin-bottom:16px;">${btns}</div>
      <div class="card"><div class="empty"><div class="big">Pas encore d’historique</div>
      Aucune dépense sur ${apercuPeriod===1?'le mois précédent':`les ${apercuPeriod} mois précédents`}. Importez un relevé pour remplir cette vue.</div></div>`;
  }

  const maxMonth = Math.max(...b.monthTotals.map(m=>m.total)) || 1;
  const moyenne = b.grand / b.nMonths;

  const barres = b.monthTotals.map(m=>{
    const largeur = Math.round(m.total/maxMonth*100);
    const segs = m.total>0 ? m.segs.map(s=>
      `<span style="width:${(s.value/m.total*100).toFixed(2)}%;background:${s.color};"

    return `<div class="mrow">

        <span class="mrow-tot">${fmt(m.total)}</span>
      </div>
      <div class="mrow-rail"><div class="mrow-stack" style="width:${Math.max(2,largeur)}%">${segs}</div></div>
    </div>`;
  }).join('');

  const fleche = p => p>0 ? `<span style="color:var(--coral);">▲ ${p} %</span>`
                    : p<0 ? `<span style="color:var(--mint);">▼ ${Math.abs(p)} %</span>`
                    : `<span style="color:var(--ink-faint);">=</span>`;

  const lignes = b.legend.map(c=>{
    const pct = Math.round(c.total/b.grand*100);
    const t = b.trend.get(c.name);
    // « Autres catégories » est un regroupement d'affichage, pas une vraie catégorie :

      <span class="chip" style="background:${c.color}"></span>
      <span class="label">${escapeHTML(c.name)}</span>
      ${t!==undefined ? `<span class="pct" style="font-size:11px;">${fleche(t)}</span>` : `<span class="pct">${pct} %</span>`}
      <span class="amt" style="color:${c.color}">${fmt(c.total)}</span>
      ${cliquable?'<span class="drill-arrow">›</span>':''}
    </div>`;
  }).join('');

  return `
    <div class="toggle-group" style="margin-bottom:16px;">${btns}</div>
    <div class="card">
      ${barres}
      <div style="margin-top:4px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);">
        <span>Moyenne mensuelle</span>
        <span style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);">${fmt(moyenne)}</span>
      </div>
    </div>
    <div class="card">
      ${lignes}
      ${b.nMonths>=2 ? `<p class="muted" style="font-size:11px;margin:12px 0 0;line-height:1.5;">
        Les flèches comparent ${monthLabel(mks[0])} à la moyenne des ${b.nMonths-1} mois précédent${b.nMonths>2?'s':''}.</p>` : ''}
    </div>`;
}

// ---------- DÉTAIL D'UNE CATÉGORIE (depuis l'Aperçu) ----------
// Ouverte en plein écran par-dessus l'onglet courant : la liste peut être longue,
// une modale serait vite illisible au doigt.
let drill = null;   // {cat, period} ou null
let drillQ = '';    // filtre libellé, sert aussi à cibler un reclassement en masse

function openDrill(cat, period){
  drill = {cat, period};
  drillQ = '';
  render();
  window.scrollTo(0,0);
}
function closeDrill(){ drill = null; drillQ = ''; render(); window.scrollTo(0,0); }

// Opérations de la catégorie sur la période, filtrées par la recherche
function drillTx(){
  const mks = new Set(lastMonths(drill.period));
  const q = drillQ.trim().toLowerCase();
  return state.transactions
    .filter(t=>t.amount<0 && (t.category||'Non catégorisé')===drill.cat && mks.has(monthKey(t.date)))
    .filter(t=>!q || (t.description||'').toLowerCase().includes(q))
    .sort((a,b)=>b.date.localeCompare(a.date));
}

function reclasser(ids, target){
  let n = 0;
  ids.forEach(id=>{
    const t = state.transactions.find(x=>x.id===id);
    if(!t || t.category===target) return;
    t.category = target;
    t.autoCat = '';          // le classement devient manuel : plus d'explication « auto »
    t.updatedAt = Date.now();
    n++;
  });
  if(n) saveData();
  return n;
}

function drillHTML(){
  const list = drillTx();
  const total = list.reduce((s,t)=>s+Math.abs(t.amount),0);
  const info = catInfo(drill.cat);
  const per = drill.period===1 ? 'le mois précédent' : `les ${drill.period} derniers mois`;

  // regroupement par mois : on garde le repère temporel de l'Aperçu
  const byMonth = new Map();
  list.forEach(t=>{
    const mk = monthKey(t.date);
    if(!byMonth.has(mk)) byMonth.set(mk, []);
    byMonth.get(mk).push(t);
  });

  // le menu ne réaffiche pas la catégorie courante — on vient de filtrer dessus,
  // elle serait identique sur toutes les lignes. C'est une action, pas un état.
  const catOpts = `<option value="">Reclasser…</option>` + state.categories
    .filter(c=>c.name!==drill.cat)
    .map(c=>`<option value="${escapeHTML(c.name)}">${escapeHTML(c.name)}</option>`).join('');

  const groupes = [...byMonth.entries()].map(([mk, txs])=>{
    const sous = txs.reduce((s,t)=>s+Math.abs(t.amount),0);
    return `
    <div class="drill-mois">
      <span>${escapeHTML(monthLabel(mk))}</span>
      <span>${fmt(sous)}</span>
    </div>
    ${txs.map(t=>`
      <div class="drill-row">
        <div class="drill-line">
          <span class="drill-date">${t.date.split('-').reverse().slice(0,2).join('/')}</span>
          <span class="drill-desc">${escapeHTML(t.description||'(sans libellé)')}</span>
          <span class="drill-amt">${fmt(Math.abs(t.amount))}</span>
        </div>
        <select class="drill-cat" data-recat="${t.id}">${catOpts}</select>
      </div>`).join('')}`;
  }).join('');

  return `
    <button class="ghost" id="drill-back" style="width:auto;padding:0;margin:0 0 14px;text-align:left;">← Retour à l’aperçu</button>

    <div class="card" style="border-left:3px solid ${info.color};">
      <div class="mois-eyebrow" style="color:${info.color};">${escapeHTML(drill.cat)}</div>
      <div class="mois-big" style="font-size:28px;color:var(--ink);">${fmt(total)}</div>
      <div class="mois-sub">${list.length} opération${list.length>1?'s':''} sur ${per}${drillQ?` · filtre « ${escapeHTML(drillQ)} »`:''}</div>
    </div>

    <input type="text" id="drill-q" placeholder="Filtrer par libellé (ex. SUPER U)…" value="${escapeHTML(drillQ)}" style="margin-bottom:12px;">
    ${list.length ? `<button class="secondary" id="drill-bulk" style="margin-bottom:16px;">
      Reclasser ces ${list.length} opération${list.length>1?'s':''} d’un coup
    </button>` : ''}

    <div class="card" style="padding:6px 16px 14px;">
      ${list.length ? groupes : `<div class="empty"><div class="big">Aucune opération</div>
        ${drillQ ? 'Aucun libellé ne correspond à ce filtre.' : `Rien dans cette catégorie sur ${per}.`}</div>`}
    </div>

    <p class="muted" style="font-size:11.5px;line-height:1.6;margin:0 0 8px;">
      Changez la catégorie d’une ligne avec le menu déroulant. Pour corriger une enseigne en bloc,
      filtrez son libellé puis utilisez le bouton de reclassement groupé. Chaque correction sert aux imports suivants.
    </p>`;
}

function attachDrillHandlers(){
  const back = document.getElementById('drill-back');
  if(back) back.onclick = closeDrill;

  const q = document.getElementById('drill-q');
  if(q) q.oninput = e=>{
    drillQ = e.target.value;
    render();
    const again = document.getElementById('drill-q');
    if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };

  document.querySelectorAll('[data-recat]').forEach(sel=>{
    sel.onchange = ()=>{
      if(!sel.value) return;   // « Reclasser… », aucune cible choisie
      const n = reclasser([sel.dataset.recat], sel.value);
      if(n) showToast(`Reclassée en « ${sel.value} »`, 'ok');
      render();
    };
  });

  const bulk = document.getElementById('drill-bulk');
  if(bulk) bulk.onclick = async ()=>{
    const list = drillTx();
    if(!list.length) return;
    const cible = await askCategory({
      title:'Reclasser en masse',
      message:`${list.length} opération(s) actuellement dans « ${drill.cat} »${drillQ?` et contenant « ${drillQ} »`:''} vont changer de catégorie.`,
      exclude: drill.cat
    });
    if(!cible) return;
    const n = reclasser(list.map(t=>t.id), cible);
    showToast(`${n} opération(s) reclassée(s) en « ${cible} »`, 'ok');
    render();
  };
}

function apercuHTML(){
  const mtx = thisMonthTx();
  const expByCat = {};
  // l'épargne est un transfert, pas une dépense : elle ne fausse pas la répartition
  mtx.filter(t=>t.amount<0 && !isSavings(t)).forEach(t=>{
    expByCat[t.category] = (expByCat[t.category]||0) + Math.abs(t.amount);
  });
  const entries = Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);
  const totalExp = entries.reduce((s,[,v])=>s+v,0);

}

function donutHTML(entries, total){
  let acc = 0;
  const stops = entries.map(([cat,amt])=>{
    const info = catInfo(cat);
    const start = acc/total*360;
    acc += amt;
    const end = acc/total*360;
    return `${info.color} ${start}deg ${end}deg`;
  }).join(', ');
  return `
    <div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${stops});">
        <div class="donut-hole">
          <div class="donut-total">${fmt(-total)}</div>
          <div class="donut-label">Dépensé</div>
        </div>
      </div>
    </div>`;
}

// ================= CLASSEMENT AUTOMATIQUE DES OPÉRATIONS =================
// Les libellés bancaires sont bruités : « CB CARREFOUR MARKET 04/08 CARTE 3901 ».
// On les réduit à un noyau marchand, puis on cherche une catégorie dans cet
// ordre : ce que vous avez déjà classé vous-même > vos charges récurrentes >
// dictionnaire d'enseignes > nature de l'opération. Rien n'est inventé sans
// motif : à défaut, la ligne reste « À catégoriser ».

const OP_NOISE = /\b(CB|PAIEMENT|PAIMT|ACHAT|FACT|FACTURE|PRLV|PRELEVEMENT|PRELVT|VIR|VIREMENT|VRST|VERSEMENT|SEPA|INST|RECU|EMIS|REF|MANDAT|ECHEANCE|TIP|DAB|GAB|RETRAIT|CHQ|CHEQUE|NUM|CLIENT|CONTRAT|FR|FRA|SARL|SAS|SASU|EURL|SCI|MR|MME|DU|DE|DES|LA|LE|LES|UN|UNE|AU|AUX|PAR|POUR|SUR|AVEC|CHEZ|ET|EN|A)\b/g;

// Mots qui subsistent après nettoyage mais ne désignent aucun marchand : ils ne
// doivent pas servir de clé d'apprentissage, sinon « CARTE » finirait par
// caractériser une catégorie à lui tout seul.
const HIST_STOP = new Set(['CARTE','CARD','FRANCE','MAGASIN','BOUTIQUE','CENTRE','SAINT',
  'STE','CEDEX','AVENUE','BOULEVARD','ROUTE','PLACE','RUE','COMPTE','OPERATION','MENSUEL',
  'MENSUELLE','ANNUEL','ANNUELLE','SERVICE','SERVICES','TOTAL']);

function stripAccents(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
// noyau marchand : sans accents, sans ponctuation, sans dates ni numéros,
// sans les mots de service des relevés bancaires
function normLabel(s){
  let t = stripAccents(s).replace(/[^A-Z0-9]+/g,' ');
  t = t.replace(/\b\d+\b/g,' ');
  t = t.replace(OP_NOISE,' ');
  return t.replace(/\s+/g,' ').trim();
}
// nature de l'opération, lue AVANT le nettoyage
function opKind(raw){
  const u = stripAccents(raw);
  if(/\b(RETRAIT|DAB|GAB|DISTRIB)\b/.test(u)) return 'retrait';
  if(/\b(CHQ|CHEQUE)\b/.test(u)) return 'cheque';
  if(/\b(PRLV|PRELEVEMENT|PRELVT)\b/.test(u)) return 'prelevement';
  if(/\b(VIR|VIREMENT)\b/.test(u)) return 'virement';
  if(/\b(CB|CARTE|PAIEMENT|PAIMT)\b/.test(u)) return 'carte';
  return '';
}

// Motifs à plat, les plus longs d'abord (« AMAZON PRIME » avant « AMAZON »).
// Chaque motif passe par le même normaliseur que les libellés : un motif qui
// contiendrait un mot supprimé au nettoyage (« COTISATION CARTE ») ne pourrait
// jamais correspondre. On le normalise donc plutôt que d'espérer qu'il colle,
// et on signale en console tout motif qui se vide ou devient trop court.
const MERCHANT_PATTERNS = (()=>{
  const out = [], seen = new Set(), bad = [];
  MERCHANT_DICT.forEach(([cat, pats])=>{
    pats.split('|').forEach(p=>{
      const raw = p.trim();
      if(!raw) return;
      const pat = normLabel(raw);
      if(pat.length < 3){ bad.push(raw); return; }
      const key = pat + '→' + cat;
      if(seen.has(key)) return;
      seen.add(key);
      out.push({pat, raw, cat, re: new RegExp('(^| )' + pat + '( |$)')});
    });
  });
  if(bad.length) console.warn('Motifs ignorés (vidés par la normalisation) :', bad);
  return out.sort((a,b)=>b.pat.length - a.pat.length);
})();

// Ce que VOUS avez déjà classé prime sur le dictionnaire : index construit à la
// volée sur l'historique, il apprend donc de chaque correction sans réglage.
function buildHistoryIndex(){
  const exact = new Map();   // libellé normalisé complet -> {cat: n}
  const token = new Map();   // mot significatif           -> {cat: n}
  const bump = (map, key, cat)=>{
    if(!key) return;
    let m = map.get(key);
    if(!m){ m = {}; map.set(key, m); }
    m[cat] = (m[cat]||0) + 1;
  };
  state.transactions.forEach(t=>{
    if(!t.category || t.category==='À catégoriser') return;
    const norm = normLabel(t.description);
    if(!norm) return;
    bump(exact, norm, t.category);
    norm.split(' ').filter(w=>w.length>=4 && !HIST_STOP.has(w)).forEach(w=>bump(token, w, t.category));
  });
  // un mot présent dans 4 catégories différentes ne discrimine rien
  token.forEach((m,k)=>{ if(Object.keys(m).length >= 4) token.delete(k); });
  return {exact, token};
}
function topOf(counts){
  if(!counts) return null;
  const e = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!e.length) return null;
  const total = e.reduce((s,[,n])=>s+n, 0);
  return {cat:e[0][0], n:e[0][1], share:e[0][1]/total};
}

// renvoie {category, why, level} — level : 'sure' | 'guess' | 'weak'
function guessCategory(desc, amount, ctx){
  const norm = normLabel(desc);
  const kind = opKind(desc);

  // 1) votre historique
  if(ctx && ctx.hist && norm){
    const ex = topOf(ctx.hist.exact.get(norm));
    if(ex) return {category:ex.cat, why:'déjà classé ainsi', level:'sure'};
    const agg = {};
    norm.split(' ').filter(w=>w.length>=4 && !HIST_STOP.has(w)).forEach(w=>{
      const m = ctx.hist.token.get(w);
      if(m) Object.entries(m).forEach(([c,n])=>{ agg[c] = (agg[c]||0) + n; });
    });
    const t = topOf(agg);
    if(t && t.share >= 0.6){
      return {category:t.cat, why:'d’après votre historique', level: t.n>=2 ? 'sure' : 'guess'};
    }
  }

  // 2) vos charges récurrentes déclarées
  const nTokens = norm.split(' ').filter(w=>w.length>=3);
  const rec = state.recurring.find(r=>{
    const signed = r.type==='expense' ? -Math.abs(r.amount) : Math.abs(r.amount);
    if(Math.abs(amount - signed) > Math.max(2, Math.abs(signed)*0.02)) return false;
    return labelTokens(r.label).some(w=>nTokens.includes(w.toUpperCase()));
  });
  if(rec) return {category:rec.category, why:`récurrent « ${rec.label} »`, level:'sure'};

  // 3) dictionnaire d'enseignes
  if(norm){
    const hit = MERCHANT_PATTERNS.find(m=>m.re.test(norm));
    if(hit){
      // un remboursement garde la catégorie de la dépense d'origine
      return {category:hit.cat, why:'enseigne reconnue', level:'guess'};
    }
  }

  // 4) nature de l'opération, en dernier recours
  if(kind==='retrait') return {category:'Retraits espèces', why:'retrait d’espèces', level:'sure'};
  if(kind==='cheque') return {category:'Chèques émis', why:'chèque émis', level:'sure'};
  if(amount > 0 && (kind==='virement' || kind==='prelevement')){
    if(/\b(SALAIRE|PAIE|PAYE|REMUNERATION|SOLDE TOUT COMPTE)\b/.test(norm))
      return {category:'Virements reçus / Revenus', why:'virement de salaire', level:'sure'};
  }
  if(kind==='virement' && amount > 0) return {category:'Virements reçus / Revenus', why:'virement reçu', level:'weak'};
  if(kind==='virement' && amount < 0) return {category:'Virements émis (tiers)', why:'virement émis', level:'weak'};
  return {category:'À catégoriser', why:'', level:null};
}

// Reclasse les opérations déjà présentes restées « À catégoriser ».
function autoClassifyExisting(){
  const ctx = {hist: buildHistoryIndex()};
  let n = 0;
  state.transactions.forEach(t=>{
    if(t.category !== 'À catégoriser') return;
    const g = guessCategory(t.description, t.amount, ctx);
    if(g.category !== 'À catégoriser'){
      t.category = g.category;
      t.autoCat = g.why;
      t.updatedAt = Date.now();
      n++;
    }
  });
  return n;
}

// ---------- PRÉVISIONNEL ----------
let recForm = {label:'',amount:'',category:'Sport / Loisirs / Abonnements',day:'1',type:'expense'};
let upForm = {label:'',amount:'',category:'Non catégorisé',date:''};
let resForm = {label:'',amount:''};
let projHorizon = 6; // horizon de projection en mois : 3, 6, 12 ou 24

// Statuts des récurrents. Une opération du mois ne peut valider qu'UN récurrent.
// Trois niveaux, du plus sûr au moins sûr :
//   1. marquage manuel de l'utilisateur — il prime toujours
//   2. montant au centime + (mot commun dans le libellé OU date à ±7 j) → « fait »
//   3. montant à ±2 % (min 2 €) + même condition → « probable », à confirmer
// Un loyer indexé de quelques euros ou un libellé bancaire opaque tombait avant
// dans aucun cas : la charge était alors comptée deux fois dans la projection.
// Un « probable » reste compté comme non passé (prudence) mais est signalé.
function labelTokens(s){
  return String(s||'').toLowerCase().split(/[^a-zà-ÿ0-9]+/).filter(w=>w.length>=3);
}
function daysOfMonth(mk){
  const [y,m] = mk.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
// un prélèvement au 31 tombe le 28 en février : sans ça il n'est jamais « attendu »
function effectiveDay(day, mk){
  return Math.min(Math.max(1, parseInt(day,10)||1), daysOfMonth(mk));
}
function recMark(r, mk){ return (r.marks && r.marks[mk]) || null; }
function setRecMark(id, mk, val){
  const r = state.recurring.find(x=>x.id===id);
  if(!r) return;
  r.marks = r.marks || {};
  if(val) r.marks[mk] = val; else delete r.marks[mk];
  r.updatedAt = Date.now();
}
function computeRecurringStatuses(monthK){
  const mk = monthK || todayISO().slice(0,7);
  const curMk = todayISO().slice(0,7);
  const mtx = state.transactions.filter(t=>monthKey(t.date)===mk);
  const usedTx = new Set();
  // sur un mois révolu, tout ce qui devait tomber est censé être tombé ; sur un
  // mois à venir, rien n'est encore attendu
  const today = mk===curMk ? new Date().getDate() : (mk<curMk ? 32 : 0);

  const lines = state.recurring.map(r=>({
    ...r,
    signed: r.type==='expense' ? -Math.abs(r.amount) : Math.abs(r.amount),
    expDay: effectiveDay(r.day, mk),
    mark: recMark(r, mk),
    st: null,
    match: null
  }));

  const fits = (l, t, tol)=>{
    if(Math.abs(t.amount - l.signed) > tol) return false;
    const dTokens = labelTokens(t.description);
    if(labelTokens(l.label).some(w=>dTokens.includes(w))) return true;
    return Math.abs(parseInt(t.date.slice(8),10) - l.expDay) <= 7;
  };

  // 1) marquage manuel
  lines.forEach(l=>{
    if(l.mark==='paid') l.st = 'fait';
    else if(l.mark==='pending') l.st = 'attendu';
  });
  // 2) passe stricte, puis 3) passe tolérante
  [true, false].forEach(strict=>{
    lines.forEach(l=>{
      if(l.st) return;
      const tol = strict ? 0.01 : Math.max(2, Math.abs(l.amount)*0.02);
      const t = mtx.find(x=>!usedTx.has(x.id) && fits(l, x, tol));
      if(t){ usedTx.add(t.id); l.match = t; l.st = strict ? 'fait' : 'probable'; }
    });
  });
  lines.forEach(l=>{ if(!l.st) l.st = l.expDay <= today ? 'attendu' : 'avenir'; });
  return lines;
}

// ---------- ANALYSE D'UN MOIS ----------
// Sépare ce qui est subi (charges fixes déclarées) de ce qui est arbitrable
// (le reste), et isole ce qui n'est pas encore tombé sur le mois en cours.
function monthAnalysis(mk){
  const curMk = todayISO().slice(0,7);
  const isCurrent = mk === curMk;
  const isFuture  = mk > curMk;
  const tx = state.transactions.filter(t=>monthKey(t.date)===mk);

  const depenses = tx.filter(t=>t.amount<0 && !isSavings(t)).reduce((s,t)=>s+Math.abs(t.amount),0);
  const revenus  = tx.filter(t=>t.amount>0 && !isSavings(t)).reduce((s,t)=>s+t.amount,0);
  const epargne  = tx.filter(isSavings).reduce((s,t)=>s-t.amount,0); // >0 = placé

  const recLines = computeRecurringStatuses(mk);
  const recExp = recLines.filter(r=>r.type==='expense' && r.category!==SAVINGS_CAT);
  const passe = r => r.st==='fait' || r.st==='probable';

  // pour une charge retrouvée, le montant réellement débité prime sur le montant déclaré
  const fixePasse = recExp.filter(passe)
    .reduce((s,r)=>s + Math.abs(r.match ? r.match.amount : r.amount), 0);
  const fixeAVenir = recExp.filter(r=>!passe(r))
    .reduce((s,r)=>s + Math.abs(r.amount), 0);

  // frais ponctuels prévus (onglet Prévisionnel) qui tombent sur ce mois
  const upMonth = state.upcoming.filter(u=>monthKey(u.date)===mk);
  const upAVenir = upMonth.filter(u=>u.date>=todayISO())
    .reduce((s,u)=>s+Math.abs(u.amount),0);

  const variable = Math.max(0, depenses - fixePasse);
  const resteAPasser = (isCurrent||isFuture) ? fixeAVenir + upAVenir : 0;

  return {
    mk, isCurrent, isFuture, isPast: mk < curMk,
    tx, depenses, revenus, epargne,
    recLines, recExp, fixePasse, fixeAVenir, upMonth, upAVenir,
    variable, resteAPasser,
    nFaites: recExp.filter(passe).length,
    nTotal: recExp.length
  };
}

// Dépenses du mois par catégorie, les plus lourdes d'abord
function monthByCategory(tx){
  const map = new Map();
  tx.filter(t=>t.amount<0 && !isSavings(t)).forEach(t=>{
    const k = t.category || 'Non catégorisé';
    map.set(k, (map.get(k)||0) + Math.abs(t.amount));
  });
  return [...map.entries()].map(([name,total])=>({name,total,color:catInfo(name).color}))
    .sort((a,b)=>b.total-a.total);
}

function previsionData(){
  const bal = currentBalance();
  const today = todayISO();
  let restMonth = 0;
  const recLines = computeRecurringStatuses();
  recLines.forEach(r=>{ if(r.st!=='fait') restMonth += r.signed; });
  const upLines = state.upcoming.filter(u=>u.date>=today).map(u=>({...u, signed:-Math.abs(u.amount)}));
  // les frais dont la date est passée disparaissaient de la projection sans
  // jamais devenir une opération : on les remonte pour qu'ils soient traités
  const lateUps = state.upcoming.filter(u=>u.date<today).sort((a,b)=>a.date.localeCompare(b.date));
  const upSum = upLines.filter(u=>monthKey(u.date)===today.slice(0,7)).reduce((s,u)=>s+u.signed,0);
  const endOfMonth = bal + restMonth + upSum;
  const netRecurring = state.recurring.reduce((s,r)=>s + (r.type==='expense'?-Math.abs(r.amount):Math.abs(r.amount)),0);
  return {bal, recLines, upLines, lateUps, endOfMonth, restMonth, upSum, netRecurring};
}

// Projection mois par mois sur l'horizon choisi (en mois)
let projIncludeVar = true; // inclure l'estimation des dépenses courantes

// Moyenne mensuelle des dépenses courantes = moyenne des dépenses des 3 derniers
// mois complets, moins les charges récurrentes déclarées (pour ne pas compter double)
function avgVariableExpenses(){
  const now = new Date();
  const keys = [];
  for(let i=1;i<=3;i++){
    const total = now.getMonth()-i;
    const y = now.getFullYear() + Math.floor(total/12);
    const m = ((total%12)+12)%12;
    keys.push(`${y}-${String(m+1).padStart(2,'0')}`);
  }
  const totals = keys.map(k=>
    state.transactions.filter(t=>monthKey(t.date)===k && t.amount<0 && !isSavings(t))
      .reduce((s,t)=>s+Math.abs(t.amount),0)
  ).filter(v=>v>0);
  if(!totals.length) return 0;
  const avg = totals.reduce((a,b)=>a+b,0)/totals.length;
  // on retranche les charges récurrentes déclarées pour ne pas les compter deux
  // fois — hors épargne, déjà exclue de la moyenne ci-dessus
  const recCharges = state.recurring
    .filter(r=>r.type==='expense' && r.category!==SAVINGS_CAT)
    .reduce((s,r)=>s+Math.abs(r.amount),0);
  return Math.max(0, avg - recCharges);
}

function projectionSeries(horizon){
  const d = previsionData();
  const now = new Date();
  const avgVar = projIncludeVar ? avgVariableExpenses() : 0;
  const inRec = state.recurring.filter(r=>r.type==='income').reduce((s,r)=>s+Math.abs(r.amount),0);
  const outRec = state.recurring.filter(r=>r.type==='expense').reduce((s,r)=>s+Math.abs(r.amount),0);
  // mois courant : dépenses courantes restantes au prorata des jours restants
  const daysIn = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const varRest = avgVar * (daysIn - now.getDate()) / daysIn;
  const curKey = todayISO().slice(0,7);
  const series = [];
  let running = d.endOfMonth - varRest;
  series.push({
    key:curKey, label:monthLabel(curKey), value:running, current:true,
    inRec:null, outRec:d.restMonth, varEst:varRest,
    ups:d.upLines.filter(u=>monthKey(u.date)===curKey)
  });
  for(let i=1;i<=horizon;i++){
    const total = now.getMonth() + i;
    const key = `${now.getFullYear() + Math.floor(total/12)}-${String((total%12)+1).padStart(2,'0')}`;
    const ups = d.upLines.filter(u=>monthKey(u.date)===key);
    const upSum = ups.reduce((s,u)=>s+u.signed,0);
    running += inRec - outRec - avgVar + upSum;
    series.push({key, label:monthLabel(key), value:running, current:false, inRec, outRec, varEst:avgVar, ups});
  }
  return {data:d, series, avgVar, inRec, outRec};
}

// ---------- PLAFONDS DU MOIS ----------
// Le raisonnement : ce qui rentre ce mois-ci, moins ce qui est déjà engagé
// (charges fixes et frais prévus), donne l'enveloppe réellement arbitrable.
// Les plafonds par catégorie se calent dessus — s'ils la dépassent, le mois
// est déficitaire avant même d'avoir commencé.
const budgetOf = cat => (state.budgets.find(b=>b.category===cat) || {}).amount || 0;

function setBudget(cat, amount){
  const i = state.budgets.findIndex(b=>b.category===cat);
  if(amount > 0){
    const entry = {category:cat, amount, updatedAt:Date.now()};
    if(i>=0) state.budgets[i] = entry; else state.budgets.push(entry);
  } else if(i>=0){
    state.budgets.splice(i,1);
  }
  saveData();
}

// Les catégories qui relèvent d'un plafond : ni revenus, ni épargne, ni
// mouvements internes — on ne se fixe pas un plafond sur son salaire.
function budgetableCats(){
  const exclues = new Set([SAVINGS_CAT, 'Virements reçus / Revenus', 'À catégoriser']);
  return state.categories.filter(c=>!exclues.has(c.name));
}

function moisPrevision(){
  const mk = todayISO().slice(0,7);
  const a = monthAnalysis(mk);
  const recLines = a.recLines;

  // revenus : ce qui est déjà tombé + les revenus récurrents pas encore vus
  const recIn = recLines.filter(r=>r.type==='income');
  const inAVenir = recIn.filter(r=>r.st!=='fait' && r.st!=='probable')
                        .reduce((s,r)=>s+Math.abs(r.amount),0);
  const revenusTotal = a.revenus + inAVenir;

  // engagé : charges fixes restantes + frais ponctuels prévus non encore passés
  const engage = a.fixeAVenir + a.upAVenir;

  // dépenses déjà faites hors charges fixes retrouvées = le quotidien déjà consommé
  const quotidienFait = a.variable;

  // ce qu'il reste réellement pour le quotidien jusqu'à la fin du mois
  const enveloppe = revenusTotal - a.fixePasse - engage;   // pour tout le quotidien du mois
  const restant = enveloppe - quotidienFait;

  // consommation par catégorie sur le mois, hors charges fixes déclarées
  const parCat = new Map();
  a.tx.filter(t=>t.amount<0 && !isSavings(t)).forEach(t=>{
    const c = t.category || 'Non catégorisé';
    parCat.set(c, (parCat.get(c)||0) + Math.abs(t.amount));
  });

  const catsFixes = new Set(state.recurring.filter(r=>r.type==='expense').map(r=>r.category));
  const lignes = budgetableCats().map(c=>({
    name: c.name,
    color: c.color,
    plafond: budgetOf(c.name),
    depense: parCat.get(c.name) || 0,
    fixe: catsFixes.has(c.name)
  })).filter(l=>l.plafond>0 || l.depense>0)
     // les postes arbitrables d'abord : ce sont eux sur lesquels on peut agir
     .sort((x,y)=>(x.fixe?1:0)-(y.fixe?1:0) || (y.plafond||y.depense)-(x.plafond||x.depense));

  const totalPlafonds = lignes.reduce((s,l)=>s+l.plafond,0);
  const nPlafonds = lignes.filter(l=>l.plafond>0).length;

  return {mk, a, revenusTotal, inAVenir, engage, enveloppe, quotidienFait,
          restant, lignes, totalPlafonds, nPlafonds};
}

// Proposition de plafonds d'après les 3 derniers mois révolus, remise à l'échelle
// de l'enveloppe disponible : on part des habitudes réelles plutôt que d'une
// répartition théorique, puis on resserre si le train de vie dépasse les revenus.
function proposerPlafonds(){
  const p = moisPrevision();
  const mks = lastMonths(3);
  const moyennes = new Map();
  const fixes = new Set(state.recurring.filter(r=>r.type==='expense').map(r=>r.category));

  state.transactions.forEach(t=>{
    if(t.amount>=0 || isSavings(t)) return;
    if(!mks.includes(monthKey(t.date))) return;
    const c = t.category || 'Non catégorisé';
    if(fixes.has(c)) return;              // déjà couvert par les charges fixes
    moyennes.set(c, (moyennes.get(c)||0) + Math.abs(t.amount)/mks.length);
  });

  const noms = new Set(budgetableCats().map(c=>c.name));
  const retenues = [...moyennes.entries()].filter(([c,v])=>noms.has(c) && v>=5);
  if(!retenues.length) return 0;

  const total = retenues.reduce((s,[,v])=>s+v,0);
  const cible = p.enveloppe;
  // si les habitudes tiennent dans l'enveloppe on les garde telles quelles,
  // sinon on réduit tout proportionnellement pour rentrer dans les revenus
  const k = (cible>0 && total>cible) ? cible/total : 1;

  retenues.forEach(([c,v])=>{
    const arrondi = Math.max(5, Math.round(v*k/5)*5);   // au pas de 5 €, plus lisible
    const i = state.budgets.findIndex(b=>b.category===c);
    const entry = {category:c, amount:arrondi, updatedAt:Date.now()};
    if(i>=0) state.budgets[i] = entry; else state.budgets.push(entry);
  });
  saveData();
  return retenues.length;
}

// ---------- OPTIMISATION DE L'ÉPARGNE (livrets réglementés uniquement) ----------
// Taux fixés par l'arrêté du 28 juillet 2026, applicables du 1er août 2026 au
// 31 janvier 2027. Le CEL était renseigné à 1,0 % : il est passé à 1,25 %.
const LIVRETS = [
  {key:'lep',          nom:'LEP',          plafond:10000, taux:2.5,  note:'sous conditions de revenus'},
  {key:'livret a',     nom:'Livret A',     plafond:22950, taux:1.7},
  {key:'ldds',         nom:'LDDS',         plafond:12000, taux:1.7},
  {key:'livret jeune', nom:'Livret jeune', plafond:1600,  taux:1.7,  note:'12-25 ans, au moins le taux du Livret A'},
  {key:'pel',          nom:'PEL',          plafond:61200, taux:2.0,  note:'ouvert en 2026, brut avant flat tax'},
  {key:'cel',          nom:'CEL',          plafond:15300, taux:1.25, note:'brut avant flat tax'}
];
const LIVRETS_MAJ = '1er août 2026';
const LIVRETS_FIN = '31 janvier 2027';

function livretOfReserve(r){
  const l = String(r.label||'').toLowerCase();
  return LIVRETS.find(x=>l.includes(x.key)) || null;
}

function epargneAdviceHTML(){
  const bal = currentBalance();
  const reservesTotal = state.reserves.reduce((s,r)=>s+r.amount,0);
  const inRec = state.recurring.filter(r=>r.type==='income').reduce((s,r)=>s+Math.abs(r.amount),0);
  // un virement automatique vers un livret n'est pas du train de vie : il est
  // compté à part, sinon le matelas de sécurité paraît plus mince qu'il ne l'est
  const outRecLife = state.recurring
    .filter(r=>r.type==='expense' && r.category!==SAVINGS_CAT)
    .reduce((s,r)=>s+Math.abs(r.amount),0);
  const autoSave = state.recurring
    .filter(r=>r.type==='expense' && r.category===SAVINGS_CAT)
    .reduce((s,r)=>s+Math.abs(r.amount),0);
  const avgVar = avgVariableExpenses();
  const monthlyCost = outRecLife + avgVar;              // train de vie mensuel
  const margin = inRec - monthlyCost - autoSave;        // ce qui reste vraiment
  const tips = [];

  // 1. Matelas de sécurité : 3 à 6 mois de train de vie en réserve
  if(monthlyCost > 0){
    const months = reservesTotal / monthlyCost;
    const target = monthlyCost * 3;
    const pct = Math.min(100, Math.round(reservesTotal/target*100));
    const color = months>=3 ? 'var(--mint)' : (months>=1.5 ? 'var(--gold)' : 'var(--coral)');
    tips.push(`
      <div class="tip">
        <div class="tip-head">🛡 Matelas de sécurité</div>
        <div class="gauge"><i style="width:${pct}%;background:${color};"></i></div>
        <div class="tip-body">Vos réserves couvrent <strong style="color:${color};">${months.toFixed(1)} mois</strong> de train de vie (${fmt(monthlyCost)}/mois).
        ${months<3
          ? `L'objectif classique est 3 mois (${fmt(target)}) avant toute autre optimisation. Il manque ${fmt(Math.max(0,target-reservesTotal))}.`
          : months<6
            ? `L'objectif de 3 mois est atteint. Viser 6 mois (${fmt(monthlyCost*6)}) donne une vraie tranquillité.`
            : `Plus de 6 mois d'avance : votre épargne de précaution est solide.`}</div>
      </div>`);
  }

  // 2. Argent qui dort sur le compte courant
  const buffer = Math.max(monthlyCost, 500); // garder ~1 mois de charges sur le courant
  const excess = bal - buffer;
  if(excess > 300){
    const move = Math.floor(excess/50)*50;
    // meilleur livret non plein parmi vos réserves, sinon suggestion générique
    const dest = state.reserves
      .map(r=>({r, l:livretOfReserve(r)}))
      .filter(x=>x.l && x.r.amount < x.l.plafond)
      .sort((a,b)=>b.l.taux-a.l.taux)[0];
    const destNom = dest ? dest.r.label : 'un Livret A ou un LEP';
    const taux = dest ? dest.l.taux : 1.7;
    tips.push(`
      <div class="tip">
        <div class="tip-head">💤 Argent qui dort</div>
        <div class="tip-body">Le compte courant (${fmt(bal)}) dépasse largement le tampon utile (~${fmt(buffer)}, un mois de train de vie).
        Un compte courant ne rapporte rien : virer <strong>${fmt(move)}</strong> vers ${escapeHTML(destNom)} rapporterait environ <strong style="color:var(--mint);">${fmt(move*taux/100)}/an</strong> d'intérêts nets, tout en restant disponible à tout moment.</div>
      </div>`);
  }

  // 3. Se payer en premier : virement automatique en début de mois
  if(margin > 50){
    const auto = Math.max(10, Math.floor(margin*0.5/10)*10);
    tips.push(`
      <div class="tip">
        <div class="tip-head">🔁 ${autoSave>0?'Augmenter le virement automatique':'Se payer en premier'}</div>
        <div class="tip-body">${autoSave>0
          ? `Vous placez déjà <strong>${fmt(autoSave)}</strong> par mois automatiquement, et il reste encore <strong style="color:var(--mint);">+${fmt(margin)}</strong> de marge après coup.`
          : `Votre marge mensuelle type est de <strong style="color:var(--mint);">+${fmt(margin)}</strong>.`}
        L'épargne qui marche est celle qui part <em>avant</em> d'être dépensée : un virement automatique ${autoSave>0?'supplémentaire ':''}de <strong>${fmt(auto)}</strong> vers un livret le lendemain de la paie, et le reste du mois s'organise tout seul. Ajustable à la baisse les mois chargés.</div>
      </div>`);
  } else if(margin < 0 && monthlyCost > 0){
    tips.push(`
      <div class="tip">
        <div class="tip-head">⚠ Marge négative</div>
        <div class="tip-body">Vos charges et dépenses courantes (${fmt(monthlyCost)})${autoSave>0?` plus le virement d'épargne automatique (${fmt(autoSave)})`:''} dépassent vos revenus récurrents déclarés (${fmt(inRec)}).
        ${autoSave>0
          ? 'Réduire le virement automatique est le levier le plus rapide.'
          : 'Avant d\'optimiser l\'épargne, l\'urgence est d\'équilibrer le mois : l\'onglet Aperçu montre où partent les dépenses.'}</div>
      </div>`);
  }

  // 4. Plafonds atteints ou proches → basculer vers le livret suivant
  state.reserves.forEach(r=>{
    const l = livretOfReserve(r);
    if(!l) return;
    if(r.amount >= l.plafond*0.95){
      const next = LIVRETS
        .filter(x=>x.key!==l.key && x.key!=='livret jeune')
        .filter(x=>!state.reserves.some(o=>{ const ol=livretOfReserve(o); return ol && ol.key===x.key && o.amount>=x.plafond*0.95; }))
        .sort((a,b)=>b.taux-a.taux)[0];
      tips.push(`
        <div class="tip">
          <div class="tip-head">🧱 ${escapeHTML(r.label)} ${r.amount>=l.plafond?'au plafond':'presque plein'}</div>
          <div class="tip-body">${l.nom} est plafonné à ${fmt(l.plafond)} (hors intérêts). ${next ? `Le surplus peut aller vers un <strong>${next.nom}</strong> (${String(next.taux).replace('.',',')} %${next.note?', '+next.note:''}, plafond ${fmt(next.plafond)}).` : 'Les principaux livrets réglementés sont pleins : belle situation.'} Et à deux, chacun peut détenir son propre Livret A et son propre LDDS : les plafonds doublent.</div>
        </div>`);
    }
  });

  // 5. LEP : le meilleur taux réglementé, souvent oublié
  if(!state.reserves.some(r=>{ const l=livretOfReserve(r); return l && l.key==='lep'; })){
    tips.push(`
      <div class="tip">
        <div class="tip-head">⭐ Avez-vous droit au LEP ?</div>
        <div class="tip-body">Le Livret d'épargne populaire est le mieux rémunéré des livrets réglementés (<strong>2,5 % net</strong> contre 1,7 % pour le Livret A) pour un plafond de 10 000 € par personne. Il est soumis à un plafond de revenu fiscal de référence (environ 22 800 € pour une part fiscale, majoré selon la composition du foyer) : beaucoup de foyers y ont droit sans le savoir. Vérifiable en 2 minutes auprès de votre banque avec votre avis d'imposition, et chacun de vous deux peut en ouvrir un.</div>
      </div>`);
  }

  const empty = tips.length===0;
